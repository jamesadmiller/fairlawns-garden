Propagate — take softwood cuttings","type":"Divide / Propagate","month":"May","priority":"Low","done":false,"instructions":"Take softwood cuttings in spring or early summer from non-flowering shoots. Root in free-draining compost with bottom heat. Alternatively take semi-hardwood cuttings in late summer/autumn.","plant_url":"https://app.notion.com/p/3bab667506ae8180bca0e0ee6c8608f7","url":"https://app.notion.com/p/3bab667506ae81b19e07cc468ddd99e1"},{"id":"3bab6675-06ae-81c5-b031-dd1d7e8d43bc","name":"Prune — light trim after flowering","type":"Prune","month":"May","priority":"Low","done":false,"instructions":"Light trim after flowering. Minimal pruning required.","plant_url":"https://app.notion.com/p/3b9b667506ae817193e0e2eda211ca02","url":"https://app.notion.com/p/3bab667506ae81c5b031dd1d7e8d43bc"},{"id":"3bab6675-06ae-814c-9519-d180e737d36d","name":"Tidy — allow foliage to die back","type":"Tidy","month":"May","priority":"Medium","done":false,"instructions":"Leave foliage completely alone after flowering. Do not cut back green leaves — allow them to die back naturally so the bulb can store energy for next year. Remove only when fully yellow and papery.","plant_url":"https://app.notion.com/p/3bab667506ae81dd8159efdb1b535a6f","url":"https://app.notion.com/p/3bab667506ae814c9519d180e737d36d"},{"id":"3bab6675-06ae-816e-99c1-cc4bdb658581","name":"Feed — liquid feed monthly","type":"Feed","month":"May","priority":"Medium","done":false,"instructions":"Apply a liquid balanced fertiliser monthly through the growing season.","plant_url":"https://app.notion.com/p/3b9b667506ae818aa220f91d661e85e0","url":"https://app.notion.com/p/3bab667506ae816e99c1cc4bdb658581"},{"id":"3bab6675-06ae-814f-aef3-d5d567371f92","name":"Prune — light prune after flowering","type":"Prune","month":"May","priority":"Medium","done":false,"instructions":"Light prune to shape after flowering. Avoid cutting into old wood.","plant_url":"https://app.notion.com/p/3b9b667506ae811cae1cf5a16bcc9c5a","url":"https://app.notion.com/p/3bab667506ae814faef3d5d567371f92"},{"id":"3bab6675-06ae-8162-8cdd-e87f783a3fc7","name":"Prune — trim late spring and mid-summer","type":"Prune","month":"May","priority":"Medium","done":false,"instructions":"Trim in late spring after first flush of red growth. Trim again mid-summer if needed.","plant_url":"https://app.notion.com/p/3b9b667506ae81a2acecc2ba7de38e4f","url":"https://app.notion.com/p/3bab667506ae81628cdde87f783a3fc7"},{"id":"3bab6675-06ae-8102-838d-c918bbf22308","name":"Frost Protection — wrap pot for winter","type":"Frost Protection","month":"November","priority":"High","done":false,"instructions":"Wrap pot in bubble wrap or hessian. Move to a sheltered position away from cold winds and hard frost.","plant_url":"https://app.notion.com/p/3b9b667506ae81acb51ce8675a36271e","url":"https://app.notion.com/p/3bab667506ae8102838dc918bbf22308"},{"id":"3bab6675-06ae-81d5-b923-f3333fe049f2","name":"Frost Protection — wrap pot for winter","type":"Frost Protection","month":"November","priority":"High","done":false,"instructions":"Wrap the pot in bubble wrap or hessian to protect roots from freezing. Move to a sheltered spot or unheated greenhouse if temperatures drop below -5°C.","plant_url":"https://app.notion.com/p/3b9b667506ae818eae25ec532b33fddb","url":"https://app.notion.com/p/3bab667506ae81d5b923f3333fe049f2"},{"id":"3bab6675-06ae-818b-9a8c-f8bd433f4b27","name":"Other — ensure pot drainage over winter","type":"Other","month":"November","priority":"Low","done":false,"instructions":"Check pots are in full sun position for best flowering. Ensure excellent drainage over winter — move pots to a sheltered spot or raise on pot feet if needed to prevent waterlogging and corm rot.","plant_url":"https://app.notion.com/p/3bab667506ae815ebb19dc55ce8ca47a","url":"https://app.notion.com/p/3bab667506ae818b9a8cf8bd433f4b27"},{"id":"3bab6675-06ae-813d-a734-f98fa1111057","name":"Mulch — mulch around base (avoid crown)","type":"Mulch","month":"November","priority":"Medium","done":false,"instructions":"Apply a mulch of garden compost or bark around the plant in autumn, keeping it well away from the crown. This insulates the roots over winter. Do not cover the crown itself as this can cause rot.","plant_url":"https://app.notion.com/p/3bab667506ae81678c0fc6ca5c19226c","url":"https://app.notion.com/p/3bab667506ae813da734f98fa1111057"},{"id":"3bab6675-06ae-8168-813a-e5c4fb0e5295","name":"Mulch — autumn mulch for winter protection","type":"Mulch","month":"November","priority":"Medium","done":false,"instructions":"Apply a layer of well-rotted compost or bark mulch in late autumn to protect roots from frost and improve soil structure over winter.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae8168813ae5c4fb0e5295"},{"id":"3bab6675-06ae-8182-b56a-db87ef7b8d71","name":"Mulch — extra winter mulch over crown","type":"Mulch","month":"November","priority":"Medium","done":false,"instructions":"Tie foliage together and apply a thick mulch of straw or bark over the crown in late autumn to protect from frost.","plant_url":"https://app.notion.com/p/3b9b667506ae813888dcd8d14a88ad55","url":"https://app.notion.com/p/3bab667506ae8182b56adb87ef7b8d71"},{"id":"3bbb6675-06ae-8151-b6cd-de350c424edd","name":"Other — lift and store tubers before first frost","type":"Other","month":"October","priority":"High","done":false,"instructions":"Before the first autumn frost (typically October), cut back foliage and carefully lift tubers. Dry thoroughly, then store in barely moist compost or vermiculite in a frost-free location through winter.","plant_url":"https://app.notion.com/p/3bbb667506ae8117a205cf1a83335f01","url":"https://app.notion.com/p/3bbb667506ae8151b6cdde350c424edd"},{"id":"3bbb6675-06ae-816c-8837-fc07126dc17f","name":"Other — lift and store tubers before first frost","type":"Other","month":"October","priority":"High","done":false,"instructions":"Before the first autumn frost (typically October in the UK), cut back foliage and carefully lift tubers. Dry thoroughly, then store in barely moist compost or vermiculite in a frost-free location through winter.","plant_url":"https://app.notion.com/p/3bbb667506ae817cba78df2e09e34e41","url":"https://app.notion.com/p/3bbb667506ae816c8837fc07126dc17f"},{"id":"3bab6675-06ae-815f-976c-e820d7032502","name":"Plant — plant bulbs in autumn","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant bulbs in autumn at 8–10cm depth, pointed end up, 8–10cm apart. Ensure excellent drainage — Dutch iris are prone to bulb rot in wet conditions. Group in odd numbers for best display. Good for cutting garden.","plant_url":"https://app.notion.com/p/3bab667506ae812cb22cc4b43494acca","url":"https://app.notion.com/p/3bab667506ae815f976ce820d7032502"},{"id":"3bab6675-06ae-815c-a6e1-e210a2658c02","name":"Plant — plant roots in autumn","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant fleshy star-shaped roots in autumn at 8–10cm depth with the crown just below the surface. Handle roots very carefully — they are brittle and will not regrow if broken. Ensure excellent drainage — add grit if needed. Needs plenty of root space so plant at least 60cm apart.","plant_url":"https://app.notion.com/p/3bab667506ae81678c0fc6ca5c19226c","url":"https://app.notion.com/p/3bab667506ae815ca6e1e210a2658c02"},{"id":"3bab6675-06ae-81ec-8841-c3150d9c3d66","name":"Plant — plant bulbs in autumn","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant bulbs in autumn at 10cm depth, 10–15cm apart, in moist but well-drained humus-rich soil. Avoid waterlogged positions. Group in threes or fives for best effect.","plant_url":"https://app.notion.com/p/3bab667506ae81c88507c31b8ec2e654","url":"https://app.notion.com/p/3bab667506ae81ec8841c3150d9c3d66"},{"id":"3bab6675-06ae-8180-8feb-fdc2e910a6bf","name":"Plant — plant bulbs in autumn","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant bulbs in October or November at 15–20cm depth, pointed end up. Space 10–15cm apart in groups for best effect. Free-draining soil is essential — add grit if needed.","plant_url":"https://app.notion.com/p/3bab667506ae81fe9bf0ef1d638c0677","url":"https://app.notion.com/p/3bab667506ae81808febfdc2e910a6bf"},{"id":"3bab6675-06ae-8179-b8eb-f0e66c3661ec","name":"Plant — plant bulbs in autumn","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant bulbs in October or November at 2–3x their height depth, pointed end up. Space closely — up to 100 per m² for maximum impact. Good for front of border or pots. Free-draining soil essential.","plant_url":"https://app.notion.com/p/3bab667506ae81dd8159efdb1b535a6f","url":"https://app.notion.com/p/3bab667506ae8179b8ebf0e66c3661ec"},{"id":"3bab6675-06ae-8105-ab34-e5d4f4b2ef16","name":"Frost Protection — lift and store tubers","type":"Frost Protection","month":"October","priority":"High","done":false,"instructions":"After first frost blackens foliage, cut stems to 15cm, lift tubers carefully, dry upside down, label and store frost-free in slightly damp compost or vermiculite.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae8105ab34e5d4f4b2ef16"},{"id":"3bab6675-06ae-810b-9e8f-f797f11a3340","name":"Frost Protection — lift and store corms","type":"Frost Protection","month":"October","priority":"High","done":false,"instructions":"After first frost blackens the foliage, cut stems to 10cm, lift corms, dry thoroughly and store in a cool frost-free place over winter.","plant_url":"https://app.notion.com/p/3b9b667506ae81dda82dea78448ae2ce","url":"https://app.notion.com/p/3bab667506ae810b9e8ff797f11a3340"},{"id":"3bab6675-06ae-8134-8768-fac77be05a53","name":"Frost Protection — cut back and overwinter frost-free","type":"Frost Protection","month":"October","priority":"High","done":false,"instructions":"Cut back by half, pot up if in ground, and bring into a cool frost-free greenhouse or conservatory for winter.","plant_url":"https://app.notion.com/p/3b9b667506ae81aa8933d1ca6335efe1","url":"https://app.notion.com/p/3bab667506ae81348768fac77be05a53"},{"id":"3bab6675-06ae-813c-97cb-c5232b6421e3","name":"Plant — spring flowering bulbs","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant tulip bulbs in October–November at a depth of 3x the bulb height. In well-drained soil or add grit to planting hole. Plant in groups for impact.","plant_url":"https://app.notion.com/p/3b9b667506ae817da163fb05108db686","url":"https://app.notion.com/p/3bab667506ae813c97cbc5232b6421e3"},{"id":"3bab6675-06ae-8189-a382-fcbd809e9173","name":"Harvest — pick apples","type":"Harvest","month":"October","priority":"High","done":false,"instructions":"Harvest when fruit comes away easily with a gentle twist. Store individually wrapped in a cool dark frost-free shed.","plant_url":"https://app.notion.com/p/3b9b667506ae81a78766f8e30b90c30b","url":"https://app.notion.com/p/3bab667506ae8189a382fcbd809e9173"},{"id":"3bab6675-06ae-81ca-9f35-f01ab048f085","name":"Frost Protection — lift and store corms","type":"Frost Protection","month":"October","priority":"High","done":false,"instructions":"After first frost, cut stems to 10cm, lift corms, dry and store frost-free.","plant_url":"https://app.notion.com/p/3b9b667506ae81dda82dea78448ae2ce","url":"https://app.notion.com/p/3bab667506ae81ca9f35f01ab048f085"},{"id":"3bab6675-06ae-81fe-9974-e806286277e1","name":"Frost Protection — lift and store corms","type":"Frost Protection","month":"October","priority":"High","done":false,"instructions":"Lift corms after foliage dies back in autumn. Dry, clean and store frost-free in paper bags.","plant_url":"https://app.notion.com/p/3b9b667506ae817199d4e627e208105e","url":"https://app.notion.com/p/3bab667506ae81fe9974e806286277e1"},{"id":"3bab6675-06ae-8170-810e-fb32c1bdd38f","name":"Prune — cut back spent growth","type":"Prune","month":"October","priority":"Low","done":false,"instructions":"Cut back spent foliage in autumn. Foliage will die back naturally after flowering.","plant_url":"https://app.notion.com/p/3b9b667506ae81a78cb5fd98f640adba","url":"https://app.notion.com/p/3bab667506ae8170810efb32c1bdd38f"},{"id":"3bab6675-06ae-81d9-ada9-d78d3f6f514b","name":"Prune — cut back","type":"Prune","month":"October","priority":"Low","done":false,"instructions":"Cut back old leaves in autumn to tidy the plant and encourage fresh growth.","plant_url":"https://app.notion.com/p/3b9b667506ae81f6a6acfe28b3fdfc19","url":"https://app.notion.com/p/3bab667506ae81d9ada9d78d3f6f514b"},{"id":"3bab6675-06ae-8120-9c90-f35fb31d27e6","name":"Prune — cut back spent growth","type":"Prune","month":"October","priority":"Medium","done":false,"instructions":"Cut back spent growth to tidy the plant. Do not cut into old wood.","plant_url":"https://app.notion.com/p/3b9b667506ae81c3907cf5e755fdda20","url":"https://app.notion.com/p/3bab667506ae81209c90f35fb31d27e6"},{"id":"3bab6675-06ae-8177-ac02-ce88b8cd1aed","name":"Prune — cut back","type":"Prune","month":"October","priority":"Medium","done":false,"instructions":"Cut back spent stems to ground level in autumn.","plant_url":"https://app.notion.com/p/3b9b667506ae81d2a58ffce107260d91","url":"https://app.notion.com/p/3bab667506ae8177ac02ce88b8cd1aed"},{"id":"3bab6675-06ae-8193-9b7c-c571074b90c6","name":"Plant — plant corms in autumn","type":"Plant","month":"September","priority":"High","done":false,"instructions":"Plant corms in autumn at 5–8cm depth in gritty, free-draining compost in pots. Use a terracotta pot with crocks for extra drainage. Plant pointed end up, 3–5cm apart. Top-dress with fine grit to improve drainage and deter rodents.","plant_url":"https://app.notion.com/p/3bab667506ae815ebb19dc55ce8ca47a","url":"https://app.notion.com/p/3bab667506ae81939b7cc571074b90c6"},{"id":"3bab6675-06ae-816b-8ebb-e6a6922c415b","name":"Harvest — pick pears","type":"Harvest","month":"September","priority":"High","done":false,"instructions":"Pick while still slightly firm and ripen off the tree at room temperature. Do not leave to ripen on the tree.","plant_url":"https://app.notion.com/p/3b9b667506ae8131b22eeacda0c0fe53","url":"https://app.notion.com/p/3bab667506ae816b8ebbe6a6922c415b"},{"id":"3bab6675-06ae-8157-8b33-e0e4cf923f2c","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"September","priority":"Low","done":false,"instructions":"Continue deadheading into early autumn. Flowering will continue until first frost. Some flowers may be fully white at this time of year.","plant_url":"https://app.notion.com/p/3bab667506ae8180bca0e0ee6c8608f7","url":"https://app.notion.com/p/3bab667506ae81578b33e0e4cf923f2c"},{"id":"3bab6675-06ae-8163-988b-d1cfad0da6e3","name":"Tidy — cut plumed stems for drying","type":"Tidy","month":"September","priority":"Low","done":false,"instructions":"Cut plumed stems in early autumn, tie into bunches and hang upside down in a warm airy place to dry for indoor decoration.","plant_url":"https://app.notion.com/p/3b9b667506ae81db972de8e27c65a318","url":"https://app.notion.com/p/3bab667506ae8163988bd1cfad0da6e3"},{"id":"3bbb6675-06ae-81d1-80fb-c4e431e985b8","name":"Tidy — cut back after flowering","type":"Tidy","month":"September","priority":"Medium","done":false,"instructions":"Cut back any spent or straggly stems after flowering. If the plant becomes floppy, push twiggy sticks in around the base before flowering starts to give natural support.","plant_url":"https://app.notion.com/p/3bbb667506ae8161b10de1f5936c62c0","url":"https://app.notion.com/p/3bbb667506ae81d180fbc4e431e985b8"},{"id":"3bbb6675-06ae-8194-ae85-c71cc3b4df05","name":"Tidy — cut back after flowering, assess for replacement","type":"Tidy","month":"September","priority":"Medium","done":false,"instructions":"Cut back after flowering finishes. As an annual/short-lived perennial it will not reliably survive winter — clear plants and consider replacing with fresh seed-raised plants next year. Take semi-ripe cuttings in early autumn if you wish to overwinter under glass.","plant_url":"https://app.notion.com/p/3bbb667506ae8143b75dc5098eb49c0b","url":"https://app.notion.com/p/3bbb667506ae8194ae85c71cc3b4df05"},{"id":"3bab6675-06ae-8111-ab0d-eb51bb9cd2fd","name":"Plant — sow or plant out for next season","type":"Plant","month":"September","priority":"Medium","done":false,"instructions":"Sow seed or plant out young plug plants in autumn for flowering the following year, or plant out in spring for the same year. Grow in fertile, well-drained neutral to slightly alkaline soil in full sun.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae8111ab0deb51bb9cd2fd"},{"id":"3bab6675-06ae-8110-82f5-f11d207c1479","name":"Plant — spring flowering bulbs","type":"Plant","month":"September","priority":"Medium","done":false,"instructions":"Plant crocus corms in autumn at 8–10cm depth and 8cm apart. Excellent for naturalising in grass.","plant_url":"https://app.notion.com/p/3b9b667506ae81b3bd2bdcd7d51fb829","url":"https://app.notion.com/p/3bab667506ae811082f5f11d207c1479"},{"id":"3bab6675-06ae-8170-bf63-fb3762a6730d","name":"Plant — spring flowering bulbs","type":"Plant","month":"September","priority":"Medium","done":false,"instructions":"Plant snowdrop bulbs in autumn or divide and replant ‘in the green’ after flowering in March. Best in moist, humus-rich soil under deciduous trees.","plant_url":"https://app.notion.com/p/3b9b667506ae813b8273f8fe7ed3c1f7","url":"https://app.notion.com/p/3bab667506ae8170bf63fb3762a6730d"},{"id":"3bab6675-06ae-817d-afbb-f9e695025660","name":"Plant — spring flowering bulbs","type":"Plant","month":"September","priority":"Medium","done":false,"instructions":"Plant muscari bulbs in autumn at 10cm depth. Naturalise well in grass or under deciduous shrubs.","plant_url":"https://app.notion.com/p/3b9b667506ae81298c9bf612dfedddc7","url":"https://app.notion.com/p/3bab667506ae817dafbbf9e695025660"},{"id":"3bab6675-06ae-81a0-9052-e5c4b7fc0053","name":"Prune — cut back","type":"Prune","month":"September","priority":"Medium","done":false,"instructions":"Cut back to basal rosette after flowering has finished.","plant_url":"https://app.notion.com/p/3b9b667506ae81b6889fcd37dba5c0cc","url":"https://app.notion.com/p/3bab667506ae81a09052e5c4b7fc0053"}],"groupings":[{"name":"The Classic Country Border","conditions":"Sun to light shade · Good garden soil · May–October","context":"A timeless English border combination. Campanula and Thalictrum provide elegant height at the rear; Rudbeckia extends warm golden colour deep into autumn when everything else is winding down.","works_alongside":"Roses (any colour), Peonies — the violet-blue palette complements pink and red Roses without clashing","plants":[{"name":"Geranium 'Rozanne'","slug":"geranium-rozanne-3c7b6675"},{"name":"Penstemon 'Garnet'","slug":"penstemon-garnet-3c7b6675"},{"name":"Rudbeckia fulgida 'Goldsturm'","slug":"rudbeckia-fulgida-goldsturm-3c7b6675"},{"name":"Campanula lactiflora 'Prichard's Variety'","slug":"campanula-lactiflora-prichard-s-variety-3c7b6675"},{"name":"Thalictrum delavayi 'Hewitt's Double'","slug":"thalictrum-delavayi-hewitt-s-double-3c7b6675"},{"name":"Lupinus polyphyllus","slug":"lupinus-polyphyllus-3c7b6675"}],"url":"https://app.notion.com/p/3c7b667506ae817694aeebd81937bd8f"},{"name":"The Dry Sunny Border","conditions":"Full sun · Poor, well-drained soil · May–September","context":"Five plants that actively thrive on drought and neglect. All will improve as summers get hotter — the combination looks better, not worse, without irrigation.","works_alongside":"Hydrangea, Magnolia — the cool blue palette softens both without competing","plants":[{"name":"Nepeta 'Six Hills Giant'","slug":"nepeta-six-hills-giant-3c7b6675"},{"name":"Origanum laevigatum 'Herrenhausen'","slug":"origanum-laevigatum-herrenhausen-3c7b6675"},{"name":"Salvia nemorosa 'Caradonna'","slug":"salvia-nemorosa-caradonna-3c7b6675"},{"name":"Eryngium × tripartitum","slug":"eryngium-tripartitum-3c7b6675"},{"name":"Echinops ritro 'Veitch's Blue'","slug":"echinops-ritro-veitch-s-blue-3c7b6675"},{"name":"Lavandula angustifolia","slug":"lavandula-angustifolia-3c7b6675"}],"url":"https://app.notion.com/p/3c7b667506ae8167a929cb9a097630ad"},{"name":"The Late Summer Focus","conditions":"Full sun · Well-drained soil · July–October","context":"A combination where the season builds rather than peaks early — designed to carry the garden when spring shrubs and early perennials have finished, and fill the August–October gap.","works_alongside":"Hydrangea paniculata (whose white flowers turn pink in August) — the warm tones complement the fading Hydrangea perfectly","plants":[{"name":"Achillea 'Terracotta'","slug":"achillea-terracotta-3c7b6675"},{"name":"Rudbeckia fulgida 'Goldsturm'","slug":"rudbeckia-fulgida-goldsturm-3c7b6675"},{"name":"Helenium 'Sahin's Early Flowerer'","slug":"helenium-sahin-s-early-flowerer-3c7b6675"},{"name":"Echinops ritro 'Veitch's Blue'","slug":"echinops-ritro-veitch-s-blue-3c7b6675"},{"name":"Persicaria amplexicaulis 'Firetail'","slug":"persicaria-amplexicaulis-firetail-3c7b6675"},{"name":"Anemone × hybrida","slug":"anemone-hybrida-3c7b6675"}],"url":"https://app.notion.com/p/3c7b667506ae81699ae3fcb27982ac3c"},{"name":"The Peony Companions","conditions":"Sun to light shade · Any soil · May–October","context":"Designed to share a bed with the Peonies being redistributed around the garden. These four ensure continuity of interest from June through October after Peony season ends, without competing for water during dry months.","works_alongside":"Give plants 45–60 cm clearance from Peony crowns. Geranium 'Rozanne' is excellent for disguising dying Peony foliage in early summer","plants":[{"name":"Nepeta 'Six Hills Giant'","slug":"nepeta-six-hills-giant-3c7b6675"},{"name":"Geranium 'Rozanne'","slug":"geranium-rozanne-3c7b6675"},{"name":"Salvia nemorosa 'Caradonna'","slug":"salvia-nemorosa-caradonna-3c7b6675"},{"name":"Knautia macedonica","slug":"knautia-macedonica-3c7b6675"},{"name":"Lupinus polyphyllus","slug":"lupinus-polyphyllus-3c7b6675"}],"url":"https://app.notion.com/p/3c7b667506ae81c599a7fe9e2d30dedf"},{"name":"The Pollinator Tapestry","conditions":"Sun · Free-draining soil preferred · June–October","context":"Outstanding for butterflies and bees from June right through October. Verbena and Veronicastrum act as airy see-through verticals; Sanguisorba and Scabiosa fill the front with quiet detail.","works_alongside":"Any large shrub — the airy verticals work well in front of Hydrangea, Rhododendron or Magnolia","plants":[{"name":"Sanguisorba officinalis 'Tanna'","slug":"sanguisorba-officinalis-tanna-3c7b6675"},{"name":"Scabiosa 'Butterfly Blue'","slug":"scabiosa-butterfly-blue-3c7b6675"},{"name":"Knautia macedonica","slug":"knautia-macedonica-3c7b6675"},{"name":"Verbena bonariensis","slug":"verbena-bonariensis-3c7b6675"},{"name":"Veronicastrum virginicum 'Fascination'","slug":"veronicastrum-virginicum-fascination-3c7b6675"}],"url":"https://app.notion.com/p/3c7b667506ae8193b7dce0b9339ea1b9"},{"name":"The Warm Sunset","conditions":"Sun to part shade · Any reasonable soil · May–October","context":"A hot palette that builds through summer, opening with Geum in May and sustained all the way through Persicaria in October. Lychnis provides the unexpected magenta spark that lifts the whole combination.","works_alongside":"Roses (warm tones), Azalea — echoes their warm palette and extends the season well beyond it","plants":[{"name":"Geum 'Totally Tangerine'","slug":"geum-totally-tangerine-3c7b6675"},{"name":"Lychnis coronaria","slug":"lychnis-coronaria-3c7b6675"},{"name":"Achillea 'Terracotta'","slug":"achillea-terracotta-3c7b6675"},{"name":"Helenium 'Sahin's Early Flowerer'","slug":"helenium-sahin-s-early-flowerer-3c7b6675"},{"name":"Persicaria amplexicaulis 'Firetail'","slug":"persicaria-amplexicaulis-firetail-3c7b6675"}],"url":"https://app.notion.com/p/3c7b667506ae81e4be3bdfca7b9dc873"}]}</script>

<script>

const DATA = JSON.parse(document.getElementById('garden-data').textContent);
const beds = DATA.beds;
const plants = DATA.plants;

let currentTab = 'All';
const tabs = ['All','Front','Back','Various'];
const tabsEl = document.getElementById('tab-bar');
const gridEl = document.getElementById('bed-grid');

tabs.forEach(t=>{
  const btn=document.createElement('button');
  btn.className='tab-btn'+(t===currentTab?' active':'');
  btn.textContent=t;
  btn.onclick=()=>{ currentTab=t; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); };
  tabsEl.appendChild(btn);
});

function escHtml(s){if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function sunIcon(s){
  if(!s||s==='Various') return '🌤';
  if(s.includes('Full')) return '☀️';
  if(s.includes('Shade')&&!s.includes('Partial')) return '🌥';
  return '🌤';
}

function renderBed(bed){
  const bedPlants=plants.filter(p=>p.bed_url===bed.url);
  const div=document.createElement('div');div.className='bed-card';
  const notes150=bed.notes?bed.notes.slice(0,150)+(bed.notes.length>150?'…':''):'';
  const fullNotes=bed.notes||'';
  const dims=bed.dimensions&&bed.dimensions!=='—'?`${bed.dimensions}${bed.area?' · '+bed.area+'m²':''}`:'';
  const zone=bed.zone?`<div class="detail-row"><span class="detail-label">Zone</span><span class="detail-val">${escHtml(bed.zone)}</span></div>`:'';
  const plantChips=bedPlants.map(p=>`<span class="plant-chip">${escHtml(p.name)}</span>`).join('');
  const plantsList=bedPlants.length?`<div class="bed-plants-list"><div class="bed-plants-heading">Plants in this bed (${bedPlants.length})</div>${plantChips}</div>`:'';
  const notionLink=bed.url?`<a class="notion-link-btn" href="${bed.url}" target="_blank" rel="noopener">View in Notion ↗</a>`:'';
  div.innerHTML=`
    <div class="bed-header">
      <div class="bed-top">
        <div class="bed-name">${escHtml(bed.name)}</div>
        <span class="badge garden-badge garden-${bed.garden||'Various'}">${escHtml(bed.garden||'—')}</span>
      </div>
      <div class="bed-meta">
        <span class="badge sun-badge">${sunIcon(bed.sun)} ${escHtml(bed.sun||'—')}</span>
        ${bed.aspect?`<span class="badge aspect-badge">${escHtml(bed.aspect)}</span>`:''}
        <span class="badge plant-count-badge">🌿 ${bedPlants.length} plants</span>
      </div>
      ${dims?`<div class="bed-dims">📐 ${escHtml(dims)}</div>`:''}
      ${notes150?`<div class="bed-notes-preview">${escHtml(notes150)}</div>`:''}
    </div>
    <div class="bed-footer">
      <button class="expand-btn" onclick="toggleBed(this)">Show details ▾</button>
      ${notionLink}
    </div>
    <div class="bed-detail">
      ${zone}
      ${fullNotes&&fullNotes.length>150?`<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-val">${escHtml(fullNotes)}</span></div>`:''}
      ${plantsList}
    </div>`;
  return div;
}

function toggleBed(btn){
  const card=btn.closest('.bed-card');
  const det=card.querySelector('.bed-detail');
  const open=det.classList.toggle('open');
  btn.textContent=open?'Hide details ▴':'Show details ▾';
}

function render(){
  const filtered=currentTab==='All'?beds:beds.filter(b=>b.garden===currentTab);
  gridEl.innerHTML='';
  filtered.forEach(b=>gridEl.appendChild(renderBed(b)));
}

render();

</script>
</body>
