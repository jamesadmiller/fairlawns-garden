<style>

:root {
  --bloom-a:#c8a96e;--bloom-b:#8b6f4e;--ground:#faf8f3;--ground2:#f0ece0;
  --ink:#2d2416;--ink-soft:#6b5c40;--sage:#5a7a5a;--gold:#c8a96e;
  --dusk:#7a6b8a;--rule:#d4c9b0;--accent:#8b6f4e;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#1a1710;--ground2:#231f18;--ink:#ede8dc;--ink-soft:#9a9080;
  --sage:#7a9068;--dusk:#a090c8;--bloom-a:#c89a50;--rule:#3a342a;--accent:#c89a50
}}
[data-theme="dark"]{--ground:#1a1710;--ground2:#231f18;--ink:#ede8dc;--ink-soft:#9a9080;
  --sage:#7a9068;--dusk:#a090c8;--bloom-a:#c89a50;--rule:#3a342a;--accent:#c89a50}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}


.site-nav{display:flex;align-items:center;gap:1rem;padding:.8rem 1.5rem;background:var(--ink);
  position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.nav-brand{font-family:'Lora',Georgia,serif;font-size:1rem;font-weight:600;color:var(--bloom-a);
  text-decoration:none;white-space:nowrap}
.nav-links{display:flex;gap:.25rem;margin-left:auto;flex-wrap:wrap}
.nav-link{color:#c8b89a;text-decoration:none;font-size:.76rem;font-weight:500;
  padding:.35rem .65rem;border-radius:5px;transition:background .15s,color .15s;
  letter-spacing:.04em;text-transform:uppercase}
.nav-link:hover,.nav-link.active{background:rgba(200,169,110,.2);color:var(--bloom-a);text-decoration:none}
.nav-toggle{display:none;background:none;border:none;color:#c8b89a;font-size:1.3rem;cursor:pointer;padding:.3rem}
footer{padding:2rem 1.5rem;text-align:center;font-size:.78rem;color:var(--ink-soft);
  border-top:1px solid var(--rule);margin-top:4rem}
@media(max-width:640px){
  .nav-links{display:none;flex-direction:column;position:absolute;top:100%;left:0;right:0;
    background:var(--ink);padding:.5rem 1rem 1rem;gap:.1rem}
  .site-nav.open .nav-links{display:flex}
  .nav-toggle{display:block;margin-left:auto}
}


.page-header{padding:2rem clamp(1.5rem,5vw,3rem) 1rem}
.page-header h1{font-family:'Lora',Georgia,serif;font-size:clamp(1.6rem,4vw,2.4rem);
  font-weight:600;color:var(--ink);margin-bottom:.3rem}
.page-header p{color:var(--ink-soft);font-size:.9rem}
.tab-bar{display:flex;gap:.5rem;padding:.75rem clamp(1.5rem,5vw,3rem);
  border-bottom:1px solid var(--rule);background:var(--ground2);
  position:sticky;top:52px;z-index:50}
.tab-btn{padding:.45rem 1.2rem;border-radius:20px;border:1px solid var(--rule);
  background:var(--ground);font-size:.85rem;font-weight:500;cursor:pointer;
  font-family:'Inter',sans-serif;color:var(--ink-soft);transition:all .15s}
.tab-btn:hover{border-color:var(--bloom-a);color:var(--bloom-a)}
.tab-btn.active{background:var(--bloom-a);color:white;border-color:var(--bloom-a)}
.bed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:1rem;padding:1.5rem clamp(1.5rem,5vw,3rem)}
.bed-card{background:var(--ground2);border:1px solid var(--rule);border-radius:12px;
  overflow:hidden;transition:box-shadow .15s,border-color .15s}
.bed-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:var(--bloom-a)}
.bed-header{padding:1.1rem 1.1rem .75rem}
.bed-top{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.75rem}
.bed-name{font-family:'Lora',Georgia,serif;font-size:1.05rem;font-weight:600;color:var(--ink);flex:1}
.garden-badge{flex-shrink:0;padding:.2rem .6rem;border-radius:4px;font-size:.7rem;
  font-weight:600;margin-top:.2rem}
.garden-Front{background:#d1fae5;color:#065f46}
.garden-Back{background:#dbeafe;color:#1e40af}
.garden-Various{background:#fef3c7;color:#92400e}
.bed-meta{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.badge{display:inline-block;padding:.18rem .5rem;border-radius:4px;font-size:.72rem;font-weight:600}
.sun-badge{background:#fef9c3;color:#713f12;border:1px solid #fde68a}
.aspect-badge{background:var(--ground);color:var(--ink-soft);border:1px solid var(--rule)}
.plant-count-badge{background:var(--sage);color:white}
.bed-dims{font-size:.8rem;color:var(--ink-soft);margin-bottom:.4rem}
.bed-notes-preview{font-size:.83rem;color:var(--ink-soft);line-height:1.55}
.bed-footer{padding:.6rem 1.1rem .9rem;display:flex;gap:.75rem;align-items:center}
.expand-btn{flex:1;background:none;border:1px solid var(--rule);border-radius:6px;
  padding:.35rem .8rem;font-size:.78rem;color:var(--ink-soft);cursor:pointer;
  font-family:'Inter',sans-serif;transition:background .15s,color .15s}
.expand-btn:hover{background:var(--bloom-a);color:white;border-color:var(--bloom-a)}
.notion-link-btn{font-size:.78rem;color:var(--accent);font-weight:500;text-decoration:none}
.notion-link-btn:hover{text-decoration:underline}
.bed-detail{padding:.75rem 1.1rem 1rem;border-top:1px solid var(--rule);display:none}
.bed-detail.open{display:block}
.detail-row{display:flex;gap:.5rem;margin-bottom:.4rem;font-size:.83rem}
.detail-label{color:var(--ink-soft);min-width:90px;flex-shrink:0}
.detail-val{color:var(--ink)}
.bed-plants-list{margin-top:.75rem}
.bed-plants-heading{font-size:.8rem;font-weight:600;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.plant-chip{display:inline-block;background:var(--ground);border:1px solid var(--rule);
  border-radius:12px;padding:.15rem .6rem;font-size:.75rem;color:var(--ink);
  margin:.2rem .2rem 0 0}

</style>
</head>

 in the first two years.","plant_url":"https://app.notion.com/p/3bcb667506ae81909de8d293d68a7157","url":"https://app.notion.com/p/3bcb667506ae81bfb41be3827d9741a0"},{"name":"Prune \u2014 annual prune (Group 16 Floribunda)","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Prune all main stems back by a third to a half to an outward-facing bud. Remove any dead, diseased or crossing stems entirely, cutting back to healthy wood. This is the most important annual task for a floribunda rose.","plant_url":"https://app.notion.com/p/3bcb667506ae81a3a3f6ef068d66febf","url":"https://app.notion.com/p/3bcb667506ae8114bb8cc3a41f64c7ca"},{"name":"Prune \u2014 annual prune in early spring","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Prune back by a third to outward-facing buds. Remove any dead, diseased or crossing stems entirely. This repeat-flowering persica hybrid benefits from tidy annual pruning to maintain compact shape.","plant_url":"https://app.notion.com/p/3bcb667506ae81bea0eee3a5573d9bc8","url":"https://app.notion.com/p/3bcb667506ae8159b7c1f485aebd0886"},{"name":"Feed \u2014 balanced fertiliser and mulch","type":"Feed","month":"February","priority":"High","done":false,"instructions":"Apply a balanced rose fertiliser and mulch of well-rotted manure or compost around the base in late winter, keeping it away from the stem.","plant_url":"https://app.notion.com/p/3bcb667506ae81bea0eee3a5573d9bc8","url":"https://app.notion.com/p/3bcb667506ae818688ebd2dea62f345f"},{"name":"Feed \u2014 balanced fertiliser and mulch","type":"Feed","month":"February","priority":"High","done":false,"instructions":"Apply a balanced rose fertiliser and a generous mulch of well-rotted manure or compost around the base in late winter, keeping it away from the stem.","plant_url":"https://app.notion.com/p/3bcb667506ae81a3a3f6ef068d66febf","url":"https://app.notion.com/p/3bcb667506ae81969ea0f49fcb98a96e"},{"name":"Deadhead \u2014 cut back  moist compost at 18\u201320\u00b0C. Plant out after all frost risk has passed in mid-May. Space 20\u201330cm apart.","plant_url":"https://app.notion.com/p/3bbb667506ae817cba78df2e09e34e41","url":"https://app.notion.com/p/3bbb667506ae81149ba4ceb99c3b68bc"},{"name":"Prune \u2014 spring prune (Group 9)","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Wait until all frost risk has passed (mid-May), then prune back hard to healthy buds. Pruning Group 9 \u2014 never prune in autumn.","plant_url":"https://app.notion.com/p/3bbb667506ae8142a2abcfe5e4241b0e","url":"https://app.notion.com/p/3bbb667506ae8125a924f6f7983499e4"},{"name":"Divide / Propagate \u2014 take cuttings to overwinter","type":"Divide / Propagate","month":"August","priority":"High","done":true,"instructions":"Take semi-ripe cuttings in late summer or early autumn. Root under glass and overwinter frost-free. This is essential as the plant is not fully hardy.","plant_url":"https://app.notion.com/p/3bbb667506ae8142a2abcfe5e4241b0e","url":"https://app.notion.com/p/3bbb667506ae8137b7ace25fafff51c8"},{"name":"Other \u2014 lift and store tubers before first frost","type":"Other","month":"October","priority":"High","done":false,"instructions":"Before the first autumn frost (typically October), cut back foliage and carefully lift tubers. Dry thoroughly, then store in barely moist compost or vermiculite in a frost-free location through winter.","plant_url":"https://app.notion.com/p/3bbb667506ae8117a205cf1a83335f01","url":"https://app.notion.com/p/3bbb667506ae8151b6cdde350c424edd"},{"name":"Prune \u2014 spring prune (Group 9)","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Wait until all frost risk has passed (mid-May), then prune back to healthy buds. Pruning Group 9 \u2014 do not prune in autumn as old stems offer some frost protection.","plant_url":"https://app.notion.com/p/3bbb667506ae81a1abacf15c0e474488","url":"https://app.notion.com/p/3bbb667506ae816ab584d817f06190c7"},{"name":"Other \u2014 lift and store tubers before first frost","type":"Other","month":"October","priority":"High","done":false,"instructions":"Before the first autumn frost (typically October in the UK), cut back foliage and carefully lift tubers. Dry thoroughly, then store in barely moist compost or vermiculite in a frost-free location through winter.","plant_url":"https://app.notion.com/p/3bbb667506ae817cba78df2e09e34e41","url":"https://app.notion.com/p/3bbb667506ae816c8837fc07126dc17f"},{"name":"Plant \u2014 start tubers indoors, plant out after frost","type":"Plant","month":"March","priority":"High","done":false,"instructions":"Start tubers into growth indoors in March in barely moist compost at 18\u201320\u00b0C. Plant out after all frost risk has passed in mid-May. Space 20\u201330cm apart.","plant_url":"https://app.notion.com/p/3bbb667506ae8117a205cf1a83335f01","url":"https://app.notion.com/p/3bbb667506ae81d6b721cbef1c70b596"},{"name":"Other \u2014 photograph flowers and identify cultivar and pruning group","type":"Other","month":"May","priority":"High","done":false,"instructions":"Photograph the flowers when open and use them to identify the cultivar and pruning group. Flower colour, size, number of petals and flowering time are the key identifiers. Once identified, update the plant record and adjust the pruning task accordingly. Do not cut back hard until the pruning group i","plant_url":"https://app.notion.com/p/3bbb667506ae81c49560e448b1de6b29","url":"https://app.notion.com/p/3bbb667506ae81379bd0d46bf7227716"},{"name":"Prune \u2014 prune according to group (identify first)","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Do not prune until the cultivar and pruning group has been identified in flower. Once identified: Group 1 = prune lightly after flowering; Group 2 = light prune to strong buds; Group 3 = cut back hard to 30cm above soil. Repot into fresh ericaceous or general purpose compost if not repotted in the l","plant_url":"https://app.notion.com/p/3bbb667506ae81c49560e448b1de6b29","url":"https://app.notion.com/p/3bbb667506ae817f8bd3e881f9b29f5d"},{"name":"Water \u2014 keep pot well watered through summer","type":"Water","month":"June","priority":"High","done":false,"instructions":"Clematis in pots dry out quickly \u2014 check moisture daily in warm weather and water thoroughly. Do not allow to dry out completely as this stresses the plant and can trigger clematis wilt. Water at the base rather than over the foliage.","plant_url":"https://app.notion.com/p/3bbb667506ae81c49560e448b1de6b29","url":"https://app.notion.com/p/3bbb667506ae81aab610f8db5e29b9c3"},{"name":"Water \u2014 keep pot well watered through summer","type":"Water","month":"July","priority":"High","done":false,"instructions":"Water regularly through July. Apply a liquid balanced fertiliser fortnightly through the growing season to compensate for nutrients leaching from the pot.","plant_url":"https://app.notion.com/p/3bbb667506ae81c49560e448b1de6b29","url":"https://app.notion.com/p/3bbb667506ae81c9a46fc564bb41de33"},{"name":"Prune \u2014 deadhead spent trusses","type":"Prune","month":"May","priority":"High","done":false,"instructions":"Snap off spent flower trusses carefully just behind the truss once flowering has finished. Do not cut \u2014 snap cleanly to avoid damaging the growth buds immediately below. This encourages good bud set for next year.","plant_url":"https://app.notion.com/p/3bbb667506ae8185abfbc8576ecceb4c","url":"https://app.notion.com/p/3bbb667506ae81b187afe0b6d6739ee9"},{"name":"Feed \u2014 ericaceous fertiliser","type":"Feed","month":"April","priority":"High","done":false,"instructions":"Apply ericaceous (acid-loving plant) fertiliser around the base. Use rainwater if possible in hard water areas. Do not feed after July as this encourages soft growth vulnerable to frost.","plant_url":"https://app.notion.com/p/3bbb667506ae8185abfbc8576ecceb4c","url":"https://app.notion.com/p/3bbb667506ae81dda893c71d2c7e609c"},{"name":"Other \u2014 photograph flowers and identify cultivar","type":"Other","month":"April","priority":"High","done":false,"instructions":"When flowers are open take a photo and use it to identify the cultivar. Update the plant record with the correct name, flower colour and any cultivar-specific care notes. The flower colour, truss shape and size are the key identifiers.","plant_url":"https://app.notion.com/p/3bbb667506ae8185abfbc8576ecceb4c","url":"https://app.notion.com/p/3bbb667506ae81f182ace8e5a0aa7392"},{"name":"Feed \u2014 ericaceous fertiliser","type":"Feed","month":"June","priority":"High","done":false,"instructions":"Second application of ericaceous fertiliser. Do not feed after this point in the season.","plant_url":"https://app.notion.com/p/3bbb667506ae8185abfbc8576ecceb4c","url":"https://app.notion.com/p/3bbb667506ae81f2b689d870c241e7f2"},{"name":"Plant \u2014 plant out after frost risk","type":"Plant","month":"May","priority":"High","done":false,"instructions":"Plant out hardened-off seedlings after all risk of frost has passed, typically mid-May. Space 20\u201330cm apart in moderately fertile moist but well-drained soil. Water in well with a weak potash-rich fertiliser such as Tomorite.","plant_url":"https://app.notion.com/p/3bbb667506ae8143b75dc5098eb49c0b","url":"https://app.notion.com/p/3bbb667506ae8191b7b3d8941efbcee7"},{"name":"Plant \u2014 sow seeds indoors","type":"Plant","month":"February","priority":"High","done":false,"instructions":"Sow seed indoors at 18\u201320\u00b0C in trays of good quality compost, lightly covering seeds. Place in a heated propagator or warm windowsill. Pot on when first true leaves appear. Harden off before planting out after all risk of frost has passed (mid-May). Space 20\u201330cm apart.","plant_url":"https://app.notion.com/p/3bbb667506ae8143b75dc5098eb49c0b","url":"https://app.notion.com/p/3bbb667506ae81cd89f3ee168d224770"},{"name":"Prune \u2014 spring prune (Pruning Group 9)","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Wait until risk of frost has passed then prune back hard to healthy buds, removing any frost-damaged or dead stems. Pruning Group 9 \u2014 do not prune in autumn.","plant_url":"https://app.notion.com/p/3bbb667506ae81d8913fe81e60aeec32","url":"https://app.notion.com/p/3bbb667506ae810ead15f3a775a74b6f"},{"name":"Prune \u2014 spring prune (Pruning Group 9)","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Wait until risk of frost has passed then prune back hard to healthy buds, removing any frost-damaged or dead stems. Pruning Group 9 \u2014 do not prune in autumn.","plant_url":"https://app.notion.com/p/3bbb667506ae81c1909ee7ca25f02bcb","url":"https://app.notion.com/p/3bbb667506ae8179a20def2c9ebc71fc"},{"name":"Plant \u2014 plant corms in autumn","type":"Plant","month":"September","priority":"High","done":false,"instructions":"Plant corms in autumn at 5\u20138cm depth in gritty, free-draining compost in pots. Use a terracotta pot with crocks for extra drainage. Plant pointed end up, 3\u20135cm apart. Top-dress with fine grit to improve drainage and deter rodents.","plant_url":"https://app.notion.com/p/3bab667506ae815ebb19dc55ce8ca47a","url":"https://app.notion.com/p/3bab667506ae81939b7cc571074b90c6"},{"name":"Plant \u2014 plant bulbs in autumn","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant bulbs in autumn at 8\u201310cm depth, pointed end up, 8\u201310cm apart. Ensure excellent drainage \u2014 Dutch iris are prone to bulb rot in wet conditions. Group in odd numbers for best display. Good for cutting garden.","plant_url":"https://app.notion.com/p/3bab667506ae812cb22cc4b43494acca","url":"https://app.notion.com/p/3bab667506ae815f976ce820d7032502"},{"name":"Plant \u2014 plant roots in autumn","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant fleshy star-shaped roots in autumn at 8\u201310cm depth with the crown just below the surface. Handle roots very carefully \u2014 they are brittle and will not regrow if broken. Ensure excellent drainage \u2014 add grit if needed. Needs plenty of root space so plant at least 60cm apart.","plant_url":"https://app.notion.com/p/3bab667506ae81678c0fc6ca5c19226c","url":"https://app.notion.com/p/3bab667506ae815ca6e1e210a2658c02"},{"name":"Frost Protection \u2014 protect emerging shoots from late frost","type":"Frost Protection","month":"March","priority":"High","done":false,"instructions":"As soon as shoots emerge in late winter/early spring, check the forecast. If frost is expected, cover shoots with horticultural fleece overnight \u2014 young growth is vulnerable even though the plant itself is H6. Remove fleece during the day.","plant_url":"https://app.notion.com/p/3bab667506ae81678c0fc6ca5c19226c","url":"https://app.notion.com/p/3bab667506ae81a9b3c5f3c253e77fca"},{"name":"Plant \u2014 plant bulbs in autumn","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant bulbs in autumn at 10cm depth, 10\u201315cm apart, in moist but well-drained humus-rich soil. Avoid waterlogged positions. Group in threes or fives for best effect.","plant_url":"https://app.notion.com/p/3bab667506ae81c88507c31b8ec2e654","url":"https://app.notion.com/p/3bab667506ae81ec8841c3150d9c3d66"},{"name":"Prune \u2014 minimal prune midsummer to early autumn only","type":"Prune","month":"August","priority":"High","done":true,"instructions":"Prune only between midsummer and early autumn \u2014 never in spring or winter. Remove dead, diseased or crossing branches only. Minimal intervention needed. Do not prune hard.","plant_url":"https://app.notion.com/p/3bab667506ae81a693a6dd07b9cebcbd","url":"https://app.notion.com/p/3bab667506ae814a8d42e48d0daacd19"},{"name":"Mulch \u2014 mulch around base","type":"Mulch","month":"March","priority":"High","done":false,"instructions":"Apply a mulch of well-rotted leaf mould or bark around the base in spring, keeping it away from the trunk. This retains moisture and protects shallow roots. Magnolias are shallow-rooted so avoid disturbing the soil around the base.","plant_url":"https://app.notion.com/p/3bab667506ae81a693a6dd07b9cebcbd","url":"https://app.notion.com/p/3bab667506ae81aca822d65520f8599b"},{"name":"Prune \u2014 prune after flowering (Group 2)","type":"Prune","month":"July","priority":"High","done":false,"instructions":"Prune immediately after flowering (Pruning Group 2). Cut back flowered stems to maintain shape and encourage fresh growth. If overgrown, can be cut back hard straight after flowering to renovate. Remove suckers from the base to control spread.","plant_url":"https://app.notion.com/p/3bab667506ae81d09ce9e1307a349412","url":"https://app.notion.com/p/3bab667506ae8142b2eaf774221ffc1b"},{"name":"Plant \u2014 plant bulbs in autumn","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant bulbs in October or November at 15\u201320cm depth, pointed end up. Space 10\u201315cm apart in groups for best effect. Free-draining soil is essential \u2014 add grit if needed.","plant_url":"https://app.notion.com/p/3bab667506ae81fe9bf0ef1d638c0677","url":"https://app.notion.com/p/3bab667506ae81808febfdc2e910a6bf"},{"name":"Plant \u2014 plant bulbs in autumn","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant bulbs in October or November at 2\u20133x their height depth, pointed end up. Space closely \u2014 up to 100 per m\u00b2 for maximum impact. Good for front of border or pots. Free-draining soil essential.","plant_url":"https://app.notion.com/p/3bab667506ae81dd8159efdb1b535a6f","url":"https://app.notion.com/p/3bab667506ae8179b8ebf0e66c3661ec"},{"name":"Prune \u2014 spring prune (Pruning Group 9)","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Wait until risk of frost has passed then prune back hard to healthy buds, removing any frost-damaged or dead stems. Do not prune in autumn as this increases frost risk. RHS Pruning Group 9.","plant_url":"https://app.notion.com/p/3bab667506ae8180bca0e0ee6c8608f7","url":"https://app.notion.com/p/3bab667506ae8105b020cd991c5380b9"},{"name":"Frost Protection \u2014 wrap pot for winter","type":"Frost Protection","month":"November","priority":"High","done":false,"instructions":"Wrap pot in bubble wrap or hessian. Move to a sheltered position away from cold winds and hard frost.","plant_url":"https://app.notion.com/p/3b9b667506ae81acb51ce8675a36271e","url":"https://app.notion.com/p/3bab667506ae8102838dc918bbf22308"},{"name":"Frost Protection \u2014 lift and store tubers","type":"Frost Protection","month":"October","priority":"High","done":false,"instructions":"After first frost blackens foliage, cut stems to 15cm, lift tubers carefully, dry upside down, label and store frost-free in slightly damp compost or vermiculite.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae8105ab34e5d4f4b2ef16"},{"name":"Frost Protection \u2014 lift and store corms","type":"Frost Protection","month":"October","priority":"High","done":false,"instructions":"After first frost blackens the foliage, cut stems to 10cm, lift corms, dry thoroughly and store in a cool frost-free place over winter.","plant_url":"https://app.notion.com/p/3b9b667506ae81dda82dea78448ae2ce","url":"https://app.notion.com/p/3bab667506ae810b9e8ff797f11a3340"},{"name":"Deadhead \u2014 remove spent blooms","type":"Deadhead","month":"July","priority":"High","done":false,"instructions":"Continue deadheading regularly through summer for continuous flowering.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae8117b48acfacbd18dd32"},{"name":"Frost Protection \u2014 cut back and overwinter frost-free","type":"Frost Protection","month":"October","priority":"High","done":false,"instructions":"Cut back by half, pot up if in ground, and bring into a cool frost-free greenhouse or conservatory for winter.","plant_url":"https://app.notion.com/p/3b9b667506ae81aa8933d1ca6335efe1","url":"https://app.notion.com/p/3bab667506ae81348768fac77be05a53"},{"name":"Plant \u2014 spring flowering bulbs","type":"Plant","month":"October","priority":"High","done":false,"instructions":"Plant tulip bulbs in October\u2013November at a depth of 3x the bulb height. In well-drained soil or add grit to planting hole. Plant in groups for impact.","plant_url":"https://app.notion.com/p/3b9b667506ae817da163fb05108db686","url":"https://app.notion.com/p/3bab667506ae813c97cbc5232b6421e3"},{"name":"Plant \u2014 gladiolus corms","type":"Plant","month":"April","priority":"High","done":false,"instructions":"Plant corms 10\u201315cm deep once soil has warmed in April.","plant_url":"https://app.notion.com/p/3b9b667506ae81dda82dea78448ae2ce","url":"https://app.notion.com/p/3bab667506ae8142b63fc8d8083170cb"},{"name":"Harvest \u2014 pick nectarines","type":"Harvest","month":"August","priority":"High","done":true,"instructions":"Harvest when fruits give slightly under gentle thumb pressure near the stalk. Handle carefully to avoid bruising.","plant_url":"https://app.notion.com/p/3b9b667506ae81f0b55ddb6791732109","url":"https://app.notion.com/p/3bab667506ae8149bcf2deb9036d6b9f"},{"name":"Mulch \u2014 mulch around base","type":"Mulch","month":"March","priority":"High","done":false,"instructions":"Apply ericaceous compost or leaf mould as a mulch to retain moisture and maintain soil acidity.","plant_url":"https://app.notion.com/p/3b9b667506ae81df80d7dabf7eee7369","url":"https://app.notion.com/p/3bab667506ae815abf93e8e3925ce22c"},{"name":"Deadhead \u2014 remove spent blooms","type":"Deadhead","month":"June","priority":"High","done":false,"instructions":"Regularly deadhead faded blooms to keep plants flowering. Cut back to a set of leaves, not just below the flower.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae815ca886e23867a86ff5"},{"name":"Plant \u2014 gladiolus corms","type":"Plant","month":"April","priority":"High","done":false,"instructions":"Plant corms 10\u201315cm deep once soil has warmed. Plant in batches 2 weeks apart for succession of flowering.","plant_url":"https://app.notion.com/p/3b9b667506ae81a2a3ffe2b48d7ad63d","url":"https://app.notion.com/p/3bab667506ae816197e1e7465c40cb17"},{"name":"Harvest \u2014 pick pears","type":"Harvest","month":"September","priority":"High","done":false,"instructions":"Pick while still slightly firm and ripen off the tree at room temperature. Do not leave to ripen on the tree.","plant_url":"https://app.notion.com/p/3b9b667506ae8131b22eeacda0c0fe53","url":"https://app.notion.com/p/3bab667506ae816b8ebbe6a6922c415b"},{"name":"Harvest \u2014 pick cherries","type":"Harvest","month":"July","priority":"High","done":false,"instructions":"Harvest when fruits are deep red and come away easily. Net the tree before fruits ripen to protect from birds.","plant_url":"https://app.notion.com/p/3b9b667506ae811bb698cf0b3ff1f721","url":"https://app.notion.com/p/3bab667506ae816daaa7f74238a2fb52"},{"name":"Harvest \u2014 pick apples","type":"Harvest","month":"October","priority":"High","done":false,"instructions":"Harvest when fruit comes away easily with a gentle twist. Store individually wrapped in a cool dark frost-free shed.","plant_url":"https://app.notion.com/p/3b9b667506ae81a78766f8e30b90c30b","url":"https://app.notion.com/p/3bab667506ae8189a382fcbd809e9173"},{"name":"Mulch \u2014 mulch around base","type":"Mulch","month":"March","priority":"High","done":false,"instructions":"Apply ericaceous compost or leaf mould as a mulch around the base to maintain acidity and retain moisture.","plant_url":"https://app.notion.com/p/3b9b667506ae8118b4fec7dd27a30e4c","url":"https://app.notion.com/p/3bab667506ae81b69eaed9663aae0575"},{"name":"Plant \u2014 dahlias","type":"Plant","month":"May","priority":"High","done":false,"instructions":"Plant out stored tubers or young plants after last frost (mid-May in UK). Plant 10cm deep with a sturdy stake in place. Water in well.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae81bea216cb1ad3aa7ad7"},{"name":"Frost Protection \u2014 lift and store corms","type":"Frost Protection","month":"October","priority":"High","done":false,"instructions":"After first frost, cut stems to 10cm, lift corms, dry and store frost-free.","plant_url":"https://app.notion.com/p/3b9b667506ae81dda82dea78448ae2ce","url":"https://app.notion.com/p/3bab667506ae81ca9f35f01ab048f085"},{"name":"Frost Protection \u2014 wrap pot for winter","type":"Frost Protection","month":"November","priority":"High","done":false,"instructions":"Wrap the pot in bubble wrap or hessian to protect roots from freezing. Move to a sheltered spot or unheated greenhouse if temperatures drop below -5\u00b0C.","plant_url":"https://app.notion.com/p/3b9b667506ae818eae25ec532b33fddb","url":"https://app.notion.com/p/3bab667506ae81d5b923f3333fe049f2"},{"name":"Deadhead \u2014 remove spent blooms","type":"Deadhead","month":"August","priority":"High","done":true,"instructions":"Continue deadheading through late summer. Keep watering and feeding.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae81f5b67cf094aa7b0de0"},{"name":"Divide / Propagate \u2014 divide clumps","type":"Divide / Propagate","month":"August","priority":"High","done":true,"instructions":"Divide rhizomes every 3\u20134 years after flowering. Cut into sections each with a fan of leaves. Trim leaves to 15cm, plant shallowly with top of rhizome exposed to sun.","plant_url":"https://app.notion.com/p/3b9b667506ae81b3bf62efa71934012e","url":"https://app.notion.com/p/3bab667506ae81f99846e8f380799d48"},{"name":"Mulch \u2014 apply around base","type":"Mulch","month":"March","priority":"High","done":false,"instructions":"Apply a 5\u201310cm layer of well-rotted garden compost or bark mulch across all beds in early spring. Keep mulch away from plant stems and crowns. This retains moisture, suppresses weeds and feeds the soil.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae81fb9f48e8a6db7392bf"},{"name":"Frost Protection \u2014 lift and store corms","type":"Frost Protection","month":"October","priority":"High","done":false,"instructions":"Lift corms after foliage dies back in autumn. Dry, clean and store frost-free in paper bags.","plant_url":"https://app.notion.com/p/3b9b667506ae817199d4e627e208105e","url":"https://app.notion.com/p/3bab667506ae81fe9974e806286277e1"},{"name":"Feed \u2014 high-potash feed","type":"Feed","month":"April","priority":"High","done":false,"instructions":"Once established, feed fortnightly with a high-potash liquid feed (e.g. tomato fertiliser) from late spring through summer to encourage flowering.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae810bbee7cc35699fc9f0"},{"name":"Feed \u2014 potash-rich fertiliser","type":"Feed","month":"March","priority":"High","done":false,"instructions":"Apply a potash-rich fertiliser in early spring. Avoid high-nitrogen feeds which promote leaf at the expense of fruit.","plant_url":"https://app.notion.com/p/3b9b667506ae811bb698cf0b3ff1f721","url":"https://app.notion.com/p/3bab667506ae81379156c1b55d0df70a"},{"name":"Feed \u2014 high-potash feed","type":"Feed","month":"July","priority":"High","done":false,"instructions":"Continue fortnightly high-potash feeds. Keep well watered in dry spells.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae8154aeb9e267b74f7435"},{"name":"Feed \u2014 high-potash feed","type":"Feed","month":"June","priority":"High","done":false,"instructions":"Continue fortnightly high-potash feeds through summer to maximise flowering.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae8159be06f4b6f61aa79a"},{"name":"Feed \u2014 potash-rich fertiliser","type":"Feed","month":"March","priority":"High","done":false,"instructions":"Apply a potash-rich fertiliser around the base in early spring to support fruit development. Water in well.","plant_url":"https://app.notion.com/p/3b9b667506ae8131b22eeacda0c0fe53","url":"https://app.notion.com/p/3bab667506ae8172b588d53d357a51fe"},{"name":"Feed \u2014 ericaceous fertiliser","type":"Feed","month":"April","priority":"High","done":false,"instructions":"Feed with an ericaceous fertiliser in April and again in June to support healthy growth.","plant_url":"https://app.notion.com/p/3b9b667506ae811cae1cf5a16bcc9c5a","url":"https://app.notion.com/p/3bab667506ae8181a74df5645ee4f15c"},{"name":"Feed \u2014 potash-rich fertiliser","type":"Feed","month":"March","priority":"High","done":false,"instructions":"Apply a potash-rich fertiliser (e.g. sulphate of potash) around the base. Keep away from the trunk. Follow with a good watering.","plant_url":"https://app.notion.com/p/3b9b667506ae81a78766f8e30b90c30b","url":"https://app.notion.com/p/3bab667506ae8185b65ccdb3d7e52a2d"},{"name":"Feed \u2014 ericaceous fertiliser","type":"Feed","month":"June","priority":"High","done":false,"instructions":"Second application of ericaceous fertiliser. Do not feed after July as this encourages soft growth susceptible to frost.","plant_url":"https://app.notion.com/p/3b9b667506ae8118b4fec7dd27a30e4c","url":"https://app.notion.com/p/3bab667506ae8195a007f929494e8848"},{"name":"Feed \u2014 ericaceous fertiliser","type":"Feed","month":"June","priority":"High","done":false,"instructions":"Second ericaceous feed in June. Do not feed after midsummer.","plant_url":"https://app.notion.com/p/3b9b667506ae811cae1cf5a16bcc9c5a","url":"https://app.notion.com/p/3bab667506ae819e8113c74507a5d95a"},{"name":"Feed \u2014 ericaceous fertiliser","type":"Feed","month":"April","priority":"High","done":false,"instructions":"Feed with an ericaceous (acid-loving plant) fertiliser in April and again in June. Use rainwater if possible in hard water areas.","plant_url":"https://app.notion.com/p/3b9b667506ae8118b4fec7dd27a30e4c","url":"https://app.notion.com/p/3bab667506ae81b18244c03061d5837c"},{"name":"Feed \u2014 potash-rich fertiliser","type":"Feed","month":"March","priority":"High","done":false,"instructions":"Feed with a potash-rich fertiliser in early spring. Also feed with a balanced fertiliser in midsummer after fruiting.","plant_url":"https://app.notion.com/p/3b9b667506ae81f0b55ddb6791732109","url":"https://app.notion.com/p/3bab667506ae81cfa4d7dd2638bf6ce9"},{"name":"Feed \u2014 high-potash feed","type":"Feed","month":"May","priority":"High","done":false,"instructions":"Continue fortnightly high-potash liquid feeds through May. Switch to a balanced feed if growth looks weak.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae81d5ae5df8e6c46977cb"},{"name":"Feed \u2014 ericaceous fertiliser","type":"Feed","month":"April","priority":"High","done":false,"instructions":"Feed with ericaceous fertiliser in April after flowering. Use rainwater where possible.","plant_url":"https://app.notion.com/p/3b9b667506ae81df80d7dabf7eee7369","url":"https://app.notion.com/p/3bab667506ae81ddb81bc620cd3f5b3c"},{"name":"Prune \u2014 cut to 15\u201330cm late winter","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Cut all stems back to 15\u201330cm in late winter to encourage strong flowering stems.","plant_url":"https://app.notion.com/p/3b9b667506ae81d183deeb3f4f653bef","url":"https://app.notion.com/p/3bab667506ae810abc24f93bf44fdff7"},{"name":"Prune \u2014 prune mid-summer only","type":"Prune","month":"July","priority":"High","done":false,"instructions":"Prune only in mid-summer to avoid sap bleeding. Remove dead or crossing branches.","plant_url":"https://app.notion.com/p/3b9b667506ae8169bfcbf28a21b40673","url":"https://app.notion.com/p/3bab667506ae81178eb0c3d5cc0ac4ad"},{"name":"Prune \u2014 deadhead and light prune","type":"Prune","month":"May","priority":"High","done":false,"instructions":"Deadhead after flowering by snapping off spent trusses. Light prune to shape if needed.","plant_url":"https://app.notion.com/p/3b9b667506ae81df80d7dabf7eee7369","url":"https://app.notion.com/p/3bab667506ae812e8028f0b0ca168941"},{"name":"Prune \u2014 thin fruit","type":"Prune","month":"June","priority":"High","done":false,"instructions":"Thin fruit to one per cluster in late May/early June to improve size and quality.","plant_url":"https://app.notion.com/p/3b9b667506ae81f0b55ddb6791732109","url":"https://app.notion.com/p/3bab667506ae8145af20c9d04830411a"},{"name":"Prune \u2014 prune after flowering","type":"Prune","month":"July","priority":"High","done":false,"instructions":"Prune immediately after flowering. Tie in new long shoots to the support structure.","plant_url":"https://app.notion.com/p/3b9b667506ae81358ed1d2d3e88ac914","url":"https://app.notion.com/p/3bab667506ae815886d9f909db035e4e"},{"name":"Prune \u2014 winter prune to shape","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Winter prune to maintain open shape. Remove dead, diseased or crossing branches.","plant_url":"https://app.notion.com/p/3b9b667506ae8131b22eeacda0c0fe53","url":"https://app.notion.com/p/3bab667506ae8185a772f85852938c62"},{"name":"Prune \u2014 prune after harvest","type":"Prune","month":"July","priority":"High","done":false,"instructions":"Prune only after harvest (never in winter). Remove dead wood and maintain shape.","plant_url":"https://app.notion.com/p/3b9b667506ae811bb698cf0b3ff1f721","url":"https://app.notion.com/p/3bab667506ae8194a304c4546b01e66d"},{"name":"Prune \u2014 prune after flowering","type":"Prune","month":"May","priority":"High","done":false,"instructions":"Prune just after flowering. Avoid cutting into old wood as recovery is poor.","plant_url":"https://app.notion.com/p/3b9b667506ae8127a7d5c47fb82b7d22","url":"https://app.notion.com/p/3bab667506ae81a389c1cd240fbc2212"},{"name":"Trim \u2014 light trim after flowering","type":"Prune","month":"August","priority":"High","done":false,"instructions":"Trim lightly after flowering, removing spent stems. Never cut into old wood.","plant_url":"https://app.notion.com/p/3b9b667506ae81db9f4fc0c610475753","url":"https://app.notion.com/p/3bab667506ae81be96e3de2986ffcfaa"},{"name":"Prune \u2014 prune after flowering (Group 1)","type":"Prune","month":"May","priority":"High","done":false,"instructions":"Prune immediately after flowering (Group 1). Remove dead stems and trim back to healthy buds.","plant_url":"https://app.notion.com/p/3b9b667506ae812aa07cebf603035b3d","url":"https://app.notion.com/p/3bab667506ae81c2b82eefcf33db5fff"},{"name":"Prune \u2014 hard prune early spring","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Hard prune to 30\u201350cm in early spring to encourage strong new flowering stems.","plant_url":"https://app.notion.com/p/3b9b667506ae81929e3ac20f4549c114","url":"https://app.notion.com/p/3bab667506ae81c8a2e4efb931832f22"},{"name":"Prune \u2014 winter prune to shape","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Winter prune to maintain shape and remove crossing branches. Thin fruit spurs if congested.","plant_url":"https://app.notion.com/p/3b9b667506ae81a78766f8e30b90c30b","url":"https://app.notion.com/p/3bab667506ae81d7ac83fa2f1e3ce500"},{"name":"Trim \u2014 light trim after flowering","type":"Prune","month":"August","priority":"High","done":false,"instructions":"Trim lightly after flowering, removing spent flower stems. Never cut into old wood.","plant_url":"https://app.notion.com/p/3b9b667506ae8190ad68ca7e701383b0","url":"https://app.notion.com/p/3bab667506ae81e5a7e8d1dc188f3b19"},{"name":"Prune \u2014 cut back","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Hard prune to 30\u201350cm in early spring to encourage strong new growth and flowers. Deadhead during summer to reduce self-seeding.","plant_url":"https://app.notion.com/p/3b9b667506ae81da929efefe97cc7b33","url":"https://app.notion.com/p/3bab667506ae81e7aa80cd355c752286"},{"name":"Prune \u2014 hard prune","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Hard prune in early spring, cutting old stems to 30\u201350cm above ground. Wear gloves and protective clothing \u2014 leaves are very sharp.","plant_url":"https://app.notion.com/p/3b9b667506ae81db972de8e27c65a318","url":"https://app.notion.com/p/3bab667506ae81ecad36e0fbe15d1567"},{"name":"Mulch \u2014 mulch around base in spring","type":"Mulch","month":"March","priority":"Medium","done":false,"instructions":"Apply a generous mulch of well-rotted compost or leaf mould around the base each spring, keeping it away from the stem. This retains moisture and feeds the soil \u2014 particularly important in the first few years while establishing.","plant_url":"https://app.notion.com/p/3bcb667506ae81909de8d293d68a7157","url":"https://app.notion.com/p/3bcb667506ae814196a1ca9750abf1a2"},{"name":"Prune \u2014 restrict size after flowering if needed (Group 11)","type":"Prune","month":"July","priority":"Medium","done":false,"instructions":"Prune Group 11 \u2014 prune only if needed to restrict size or remove dead, damaged or crossing growth. Do this immediately after flowering in July. Avoid heavy pruning as this significantly reduces next year's flowering. Generally best left to grow freely.","plant_url":"https://app.notion.com/p/3bcb667506ae81909de8d293d68a7157","url":"https://app.notion.com/p/3bcb667506ae8148af48e4ba5b54c927"},{"name":"Feed \u2014 second feed early summer","type":"Feed","month":"June","priority":"Medium","done":false,"instructions":"Apply a second balanced rose fertiliser feed in early summer to support continuous repeat flowering through to autumn.","plant_url":"https://app.notion.com/p/3bcb667506ae81bea0eee3a5573d9bc8","url":"https://app.notion.com/p/3bcb667506ae8119a195f2bf32ba3564"},{"name":"Deadhead \u2014 remove spent blooms throughout season","type":"Deadhead","month":"July","priority":"Medium","done":false,"instructions":"Deadhead spent flower clusters throughout the season by cutting back to the first leaf with five leaflets. This encourages repeat flowering and prevents the plant setting hips.","plant_url":"https://app.notion.com/p/3bcb667506ae81a3a3f6ef068d66febf","url":"https://app.notion.com/p/3bcb667506ae8153aa7edeb7ef2c6ff1"},{"name":"Feed \u2014 second feed early summer","type":"Feed","month":"June","priority":"Medium","done":false,"instructions":"Apply a second feed of balanced rose fertiliser in early summer to support the repeat-flowering season.","plant_url":"https://app.notion.com/p/3bcb667506ae81a3a3f6ef068d66febf","url":"https://app.notion.com/p/3bcb667506ae8182a5c8e822fdc5c516"},{"name":"Other \u2014 check for blackspot, mildew and rust","type":"Other","month":"June","priority":"Medium","done":false,"instructions":"Check for blackspot (black spots on leaves), powdery mildew (white powder on shoots) and rust (orange pustules under leaves). Treat promptly with appropriate fungicide if needed. Remove and bin affected leaves \u2014 do not compost.","plant_url":"https://app.notion.com/p/3bcb667506ae81a3a3f6ef068d66febf","url":"https://app.notion.com/p/3bcb667506ae8199b6fdfc62fe41357d"},{"name":"Deadhead \u2014 remove spent blooms throughout season","type":"Deadhead","month":"July","priority":"Medium","done":false,"instructions":"Deadhead spent blooms throughout the season to encourage continuous repeat flowering. Cut back to the first leaf with five leaflets below the spent flower.","plant_url":"https://app.notion.com/p/3bcb667506ae81bea0eee3a5573d9bc8","url":"https://app.notion.com/p/3bcb667506ae81aeaa5be629f9d82f87"},{"name":"Other \u2014 check for pests and disease","type":"Other","month":"June","priority":"Medium","done":false,"instructions":"Check for aphids, blackspot, powdery mildew and red spider mite. Treat promptly if needed. Remove and bin affected leaves.","plant_url":"https://app.notion.com/p/3bcb667506ae81bea0eee3a5573d9bc8","url":"https://app.notion.com/p/3bcb667506ae81f5a7d1e527a9b49a99"},{"name":"Prune \u2014 mid-summer only if silver leaf present (Group 1)","type":"Prune","month":"July","priority":"Medium","done":false,"instructions":"Only prune if silver leaf disease is present. If so, cut back affected branches to healthy wood in mid-summer when the tree is in full leaf and the wound can seal quickly. Never prune in winter \u2014 this significantly increases the risk of silver leaf and bacterial canker entering through pruning cuts.","plant_url":"https://app.notion.com/p/3bcb667506ae81edb67bdeeadb7881aa","url":"https://app.notion.com/p/3bcb667506ae8129a14ccf028f0be135"},{"name":"Other \u2014 check for disease, harvest fruit if set","type":"Other","month":"August","priority":"Medium","done":true,"instructions":"Check for signs of silver leaf (silvery sheen on leaves) and bacterial canker (sunken, weeping lesions on bark) in spring and summer. Check for peach leaf curl (red blistered leaves) as growth emerges. If fruit sets, harvest when fully coloured \u2014 edible raw or made into jam/jelly. Fruit also valuabl","plant_url":"https://app.notion.com/p/3bcb667506ae81edb67bdeeadb7881aa","url":"https://app.notion.com/p/3bcb667506ae81f998cdce2116a908c7"}]}</script>

<script>

const DATA = JSON.parse(document.getElementById('garden-data').textContent);
const beds = DATA.beds;
const plants = DATA.plants;

let currentTab = 'All';
const tabs = ['All','Front','Back','Various'];
const tabsEl = document.getElementById('tab-bar');
const gridEl = document.getElementById('bed-grid');

tabs.forEach(t=>{
  const btn=document.createElement('button');
  btn.className='tab-btn'+(t===currentTab?' active':'');
  btn.textContent=t;
  btn.onclick=()=>{ currentTab=t; document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); };
  tabsEl.appendChild(btn);
});

function escHtml(s){if(!s)return '';const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function sunIcon(s){
  if(!s||s==='Various') return '🌤';
  if(s.includes('Full')) return '☀️';
  if(s.includes('Shade')&&!s.includes('Partial')) return '🌥';
  return '🌤';
}

function renderBed(bed){
  const bedPlants=plants.filter(p=>p.bed_url===bed.url);
  const div=document.createElement('div');div.className='bed-card';
  const notes150=bed.notes?bed.notes.slice(0,150)+(bed.notes.length>150?'…':''):'';
  const fullNotes=bed.notes||'';
  const dims=bed.dimensions&&bed.dimensions!=='—'?`${bed.dimensions}${bed.area?' · '+bed.area+'m²':''}`:'';
  const zone=bed.zone?`<div class="detail-row"><span class="detail-label">Zone</span><span class="detail-val">${escHtml(bed.zone)}</span></div>`:'';
  const plantChips=bedPlants.map(p=>`<span class="plant-chip">${escHtml(p.name)}</span>`).join('');
  const plantsList=bedPlants.length?`<div class="bed-plants-list"><div class="bed-plants-heading">Plants in this bed (${bedPlants.length})</div>${plantChips}</div>`:'';
  const notionLink=bed.url?`<a class="notion-link-btn" href="${bed.url}" target="_blank" rel="noopener">View in Notion ↗</a>`:'';
  div.innerHTML=`
    <div class="bed-header">
      <div class="bed-top">
        <div class="bed-name">${escHtml(bed.name)}</div>
        <span class="badge garden-badge garden-${bed.garden||'Various'}">${escHtml(bed.garden||'—')}</span>
      </div>
      <div class="bed-meta">
        <span class="badge sun-badge">${sunIcon(bed.sun)} ${escHtml(bed.sun||'—')}</span>
        ${bed.aspect?`<span class="badge aspect-badge">${escHtml(bed.aspect)}</span>`:''}
        <span class="badge plant-count-badge">🌿 ${bedPlants.length} plants</span>
      </div>
      ${dims?`<div class="bed-dims">📐 ${escHtml(dims)}</div>`:''}
      ${notes150?`<div class="bed-notes-preview">${escHtml(notes150)}</div>`:''}
    </div>
    <div class="bed-footer">
      <button class="expand-btn" onclick="toggleBed(this)">Show details ▾</button>
      ${notionLink}
    </div>
    <div class="bed-detail">
      ${zone}
      ${fullNotes&&fullNotes.length>150?`<div class="detail-row"><span class="detail-label">Notes</span><span class="detail-val">${escHtml(fullNotes)}</span></div>`:''}
      ${plantsList}
    </div>`;
  return div;
}

function toggleBed(btn){
  const card=btn.closest('.bed-card');
  const det=card.querySelector('.bed-detail');
  const open=det.classList.toggle('open');
  btn.textContent=open?'Hide details ▴':'Show details ▾';
}

function render(){
  const filtered=currentTab==='All'?beds:beds.filter(b=>b.garden===currentTab);
  gridEl.innerHTML='';
  filtered.forEach(b=>gridEl.appendChild(renderBed(b)));
}

render();

</script>
</body>
</html>
