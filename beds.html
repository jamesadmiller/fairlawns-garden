<style>

:root {
  --bloom-a:#c8a96e;--bloom-b:#8b6f4e;--ground:#faf8f3;--ground2:#f0ece0;
  --ink:#2d2416;--ink-soft:#6b5c40;--sage:#5a7a5a;--gold:#c8a96e;
  --dusk:#7a6b8a;--rule:#d4c9b0;--accent:#8b6f4e;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#1a1710;--ground2:#231f18;--ink:#ede8dc;--ink-soft:#9a9080;
  --sage:#7a9068;--dusk:#a090c8;--bloom-a:#c89a50;--rule:#3a342a;--accent:#c89a50
}}
[data-theme="dark"]{--ground:#1a1710;--ground2:#231f18;--ink:#ede8dc;--ink-soft:#9a9080;
  --sage:#7a9068;--dusk:#a090c8;--bloom-a:#c89a50;--rule:#3a342a;--accent:#c89a50}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:'Inter',system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}


.site-nav{display:flex;align-items:center;gap:1rem;padding:.8rem 1.5rem;background:var(--ink);
  position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.nav-brand{font-family:'Lora',Georgia,serif;font-size:1rem;font-weight:600;color:var(--bloom-a);
  text-decoration:none;white-space:nowrap}
.nav-links{display:flex;gap:.25rem;margin-left:auto;flex-wrap:wrap}
.nav-link{color:#c8b89a;text-decoration:none;font-size:.76rem;font-weight:500;
  padding:.35rem .65rem;border-radius:5px;transition:background .15s,color .15s;
  letter-spacing:.04em;text-transform:uppercase}
.nav-link:hover,.nav-link.active{background:rgba(200,169,110,.2);color:var(--bloom-a);text-decoration:none}
.nav-toggle{display:none;background:none;border:none;color:#c8b89a;font-size:1.3rem;cursor:pointer;padding:.3rem}
footer{padding:2rem 1.5rem;text-align:center;font-size:.78rem;color:var(--ink-soft);
  border-top:1px solid var(--rule);margin-top:4rem}
@media(max-width:640px){
  .nav-links{display:none;flex-direction:column;position:absolute;top:100%;left:0;right:0;
    background:var(--ink);padding:.5rem 1rem 1rem;gap:.1rem}
  .site-nav.open .nav-links{display:flex}
  .nav-toggle{display:block;margin-left:auto}
}


.page-header{padding:2rem clamp(1.5rem,5vw,3rem) 1rem}
.page-header h1{font-family:'Lora',Georgia,serif;font-size:clamp(1.6rem,4vw,2.4rem);
  font-weight:600;color:var(--ink);margin-bottom:.3rem}
.page-header p{color:var(--ink-soft);font-size:.9rem}
.tab-bar{display:flex;gap:.5rem;padding:.75rem clamp(1.5rem,5vw,3rem);
  border-bottom:1px solid var(--rule);background:var(--ground2);
  position:sticky;top:52px;z-index:50}
.tab-btn{padding:.45rem 1.2rem;border-radius:20px;border:1px solid var(--rule);
  background:var(--ground);font-size:.85rem;font-weight:500;cursor:pointer;
  font-family:'Inter',sans-serif;color:var(--ink-soft);transition:all .15s}
.tab-btn:hover{border-color:var(--bloom-a);color:var(--bloom-a)}
.tab-btn.active{background:var(--bloom-a);color:white;border-color:var(--bloom-a)}
.bed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:1rem;padding:1.5rem clamp(1.5rem,5vw,3rem)}
.bed-card{background:var(--ground2);border:1px solid var(--rule);border-radius:12px;
  overflow:hidden;transition:box-shadow .15s,border-color .15s}
.bed-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);border-color:var(--bloom-a)}
.bed-header{padding:1.1rem 1.1rem .75rem}
.bed-top{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.75rem}
.bed-name{font-family:'Lora',Georgia,serif;font-size:1.05rem;font-weight:600;color:var(--ink);flex:1}
.garden-badge{flex-shrink:0;padding:.2rem .6rem;border-radius:4px;font-size:.7rem;
  font-weight:600;margin-top:.2rem}
.garden-Front{background:#d1fae5;color:#065f46}
.garden-Back{background:#dbeafe;color:#1e40af}
.garden-Various{background:#fef3c7;color:#92400e}
.bed-meta{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.6rem}
.badge{display:inline-block;padding:.18rem .5rem;border-radius:4px;font-size:.72rem;font-weight:600}
.sun-badge{background:#fef9c3;color:#713f12;border:1px solid #fde68a}
.aspect-badge{background:var(--ground);color:var(--ink-soft);border:1px solid var(--rule)}
.plant-count-badge{background:var(--sage);color:white}
.bed-dims{font-size:.8rem;color:var(--ink-soft);margin-bottom:.4rem}
.bed-notes-preview{font-size:.83rem;color:var(--ink-soft);line-height:1.55}
.bed-footer{padding:.6rem 1.1rem .9rem;display:flex;gap:.75rem;align-items:center}
.expand-btn{flex:1;background:none;border:1px solid var(--rule);border-radius:6px;
  padding:.35rem .8rem;font-size:.78rem;color:var(--ink-soft);cursor:pointer;
  font-family:'Inter',sans-serif;transition:background .15s,color .15s}
.expand-btn:hover{background:var(--bloom-a);color:white;border-color:var(--bloom-a)}
.notion-link-btn{font-size:.78rem;color:var(--accent);font-weight:500;text-decoration:none}
.notion-link-btn:hover{text-decoration:underline}
.bed-detail{padding:.75rem 1.1rem 1rem;border-top:1px solid var(--rule);display:none}
.bed-detail.open{display:block}
.detail-row{display:flex;gap:.5rem;margin-bottom:.4rem;font-size:.83rem}
.detail-label{color:var(--ink-soft);min-width:90px;flex-shrink:0}
.detail-val{color:var(--ink)}
.bed-plants-list{margin-top:.75rem}
.bed-plants-heading{font-size:.8rem;font-weight:600;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.plant-chip{display:inline-block;background:var(--ground);border:1px solid var(--rule);
  border-radius:12px;padding:.15rem .6rem;font-size:.75rem;color:var(--ink);
  margin:.2rem .2rem 0 0}

</style>
</head>

ade","watering":"Moderate","flowering":"Summer–Autumn (July–October)","colour":"Rich crimson red — large double azalea-type flowers on tall spikes","size":"Up to 90cm × 25cm","difficulty":"Easy","pruning":"Sep","pruning_how":"Deadhead regularly to encourage continuous flowering and prevent energy going into seed production. Cut back hard after flowering or replace with fresh plants the following year.","soil":"Moderately fertile, moist but well-drained. Any well-drained soil in sun or light shade.","propagation":"Sow seed from autumn to spring at 18–20°C. Note: 'Madame Butterfly' are F1 hybrids and will not come true from saved seed. Semi-ripe cuttings can be taken in early autumn to overwinter under glass.","wildlife":"Low — double blooms less accessible to pollinators","id_confidence":"Confirmed","rhs_link":"https://www.rhs.org.uk/plants/215273/antirrhinum-majus-madame-butterfly-(mixed)-(d)/details","frost":false,"bed":"Back South Bed","bed_url":"https://app.notion.com/p/3b9b667506ae81b6a68bcae7a7b5cacf","notes":"Snapdragon. Half-hardy annual/short-lived perennial, usually grown as an annual. Large double azalea-type blooms in rich crimson red on tall stems — excellent for cutting. Tolerates dappled shade but best in full sun. F1 hybrid so does not reliably self-seed true. May be susceptible to antirrhinum rust, downy mildew, powdery mildew and Fusarium wilt. Source: Crocus https://www.crocus.co.uk/plants/_/antirrhinum-majus-madame-butterfly-red/classid.2000050381/","image":"images/plants/antirrhinum-madame-butterfly-red-3bbb6675.jpg","url":"https://app.notion.com/p/3bbb667506ae8143b75dc5098eb49c0b","to_buy":false,"border_position":"","drought":"","hardiness":"","suppliers":""},{"id":"3b9b6675-06ae-81a0-900c-c0dc1822599f","name":"Astilbe 'Dark Side of the Moon'","slug":"astilbe-dark-side-of-the-moon-3b9b6675","latin":"Astilbe 'Dark Side of the Moon'","type":"Perennial","sun":"Sun/partial shade","watering":"Moderate","flowering":"Summer","colour":"Pink plumes (summ ://app.notion.com/p/3bab667506ae81bd824afaf1ad253301"},{"id":"3bab6675-06ae-8145-9530-c06dc95101ed","name":"Feed — balanced fertiliser","type":"Feed","month":"April","priority":"Low","done":false,"instructions":"Apply a balanced fertiliser in spring to support tall growth. Avoid high nitrogen which can reduce flowering.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae81459530c06dc95101ed"},{"id":"3bbb6675-06ae-81bd-b174-f42902a1bccf","name":"Feed — balanced liquid feed fortnightly","type":"Feed","month":"April","priority":"Medium","done":false,"instructions":"Apply a balanced liquid fertiliser fortnightly from spring through summer to compensate for nutrients leaching from the pot. A high-potash feed (such as Tomorite) from midsummer encourages flowering.","plant_url":"https://app.notion.com/p/3bbb667506ae81c49560e448b1de6b29","url":"https://app.notion.com/p/3bbb667506ae81bdb174f42902a1bccf"},{"id":"3bab6675-06ae-8184-b8a8-c95b001a128f","name":"Other — check for slug and snail damage","type":"Other","month":"April","priority":"Medium","done":false,"instructions":"Check for slug and snail damage to emerging shoots in spring — this is the most vulnerable time. Use slug pellets or nematodes if needed. Young foliage is a particular target.","plant_url":"https://app.notion.com/p/3bab667506ae81678c0fc6ca5c19226c","url":"https://app.notion.com/p/3bab667506ae8184b8a8c95b001a128f"},{"id":"3bab6675-06ae-816d-ae69-c70fd728439f","name":"Tidy — remove suckers to control spread","type":"Tidy","month":"April","priority":"Medium","done":false,"instructions":"Check for suckers around the base and remove any that are spreading beyond the desired area. Pull or cut suckers as close to the root as possible.","plant_url":"https://app.notion.com/p/3bab667506ae81d09ce9e1307a349412","url":"https://app.notion.com/p/3bab667506ae816dae69c70fd728439f"},{"id":"3bab6675-06ae-81e1-9147-f604f055cb9f","name":"Feed — balanced fertiliser","type":"Feed","month":"April","priority":"Medium","done":false,"instructions":"Apply a balanced slow-release fertiliser as new growth emerges after spring pruning. Avoid high-nitrogen feeds which promote leaf at the expense of flowers. Drought tolerant once established so do not overwater.","plant_url":"https://app.notion.com/p/3bab667506ae8180bca0e0ee6c8608f7","url":"https://app.notion.com/p/3bab667506ae81e19147f604f055cb9f"},{"id":"3bab6675-06ae-8123-8621-d0166e33aa1f","name":"Feed — general balanced fertiliser","type":"Feed","month":"April","priority":"Medium","done":false,"instructions":"Apply a balanced fertiliser or top-dress with well-rotted compost in spring. Astilbes are hungry plants.","plant_url":"https://app.notion.com/p/3b9b667506ae81a0900cc0dc1822599f","url":"https://app.notion.com/p/3bab667506ae81238621d0166e33aa1f"},{"id":"3bab6675-06ae-81de-8d38-e70faf15bdb8","name":"Feed — ericaceous fertiliser","type":"Feed","month":"April","priority":"Medium","done":false,"instructions":"Feed with an ericaceous fertiliser in April and June to maintain healthy foliage and berries.","plant_url":"https://app.notion.com/p/3b9b667506ae817193e0e2eda211ca02","url":"https://app.notion.com/p/3bab667506ae81de8d38e70faf15bdb8"},{"id":"3bab6675-06ae-81bf-8b0c-fa7c5f87fd90","name":"Prune — light prune after flowering","type":"Prune","month":"April","priority":"Medium","done":false,"instructions":"Light prune immediately after flowering to maintain shape. Avoid cutting into old wood.","plant_url":"https://app.notion.com/p/3b9b667506ae8118b4fec7dd27a30e4c","url":"https://app.notion.com/p/3bab667506ae81bf8b0cfa7c5f87fd90"},{"id":"3bbb6675-06ae-8100-a0f5-de32cba4e34f","name":"Divide / Propagate — take cuttings to overwinter","type":"Divide / Propagate","month":"August","priority":"High","done":true,"instructions":"Take semi-ripe cuttings in late summer or autumn. Root in free-draining compost and overwinter under glass or on a warm windowsill. This is the key way to keep this tender plant going year to year.","plant_url":"https://app.notion.com/p/3bbb667506ae81a1abacf15c0e474488","url":"https://app.notion.com/p/3bbb667506ae8100a0f5de32cba4e34f"},{"id":"3bbb6675-06ae-8137-b7ac-e25fafff51c8","name":"Divide / Propagate — take cuttings to overwinter","type":"Divide / Propagate","month":"August","priority":"High","done":true,"instructions":"Take semi-ripe cuttings in late summer or early autumn. Root under glass and overwinter frost-free. This is essential as the plant is not fully hardy.","plant_url":"https://app.notion.com/p/3bbb667506ae8142a2abcfe5e4241b0e","url":"https://app.notion.com/p/3bbb667506ae8137b7ace25fafff51c8"},{"id":"3bab6675-06ae-814a-8d42-e48d0daacd19","name":"Prune — minimal prune midsummer to early autumn only","type":"Prune","month":"August","priority":"High","done":true,"instructions":"Prune only between midsummer and early autumn — never in spring or winter. Remove dead, diseased or crossing branches only. Minimal intervention needed. Do not prune hard.","plant_url":"https://app.notion.com/p/3bab667506ae81a693a6dd07b9cebcbd","url":"https://app.notion.com/p/3bab667506ae814a8d42e48d0daacd19"},{"id":"3bab6675-06ae-8149-bcf2-deb9036d6b9f","name":"Harvest — pick nectarines","type":"Harvest","month":"August","priority":"High","done":true,"instructions":"Harvest when fruits give slightly under gentle thumb pressure near the stalk. Handle carefully to avoid bruising.","plant_url":"https://app.notion.com/p/3b9b667506ae81f0b55ddb6791732109","url":"https://app.notion.com/p/3bab667506ae8149bcf2deb9036d6b9f"},{"id":"3bab6675-06ae-81f5-b67c-f094aa7b0de0","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"August","priority":"High","done":true,"instructions":"Continue deadheading through late summer. Keep watering and feeding.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae81f5b67cf094aa7b0de0"},{"id":"3bab6675-06ae-81f9-9846-e8f380799d48","name":"Divide / Propagate — divide clumps","type":"Divide / Propagate","month":"August","priority":"High","done":true,"instructions":"Divide rhizomes every 3–4 years after flowering. Cut into sections each with a fan of leaves. Trim leaves to 15cm, plant shallowly with top of rhizome exposed to sun.","plant_url":"https://app.notion.com/p/3b9b667506ae81b3bf62efa71934012e","url":"https://app.notion.com/p/3bab667506ae81f99846e8f380799d48"},{"id":"3bab6675-06ae-81be-96e3-de2986ffcfaa","name":"Trim — light trim after flowering","type":"Prune","month":"August","priority":"High","done":false,"instructions":"Trim lightly after flowering, removing spent stems. Never cut into old wood.","plant_url":"https://app.notion.com/p/3b9b667506ae81db9f4fc0c610475753","url":"https://app.notion.com/p/3bab667506ae81be96e3de2986ffcfaa"},{"id":"3bab6675-06ae-81e5-a7e8-d1dc188f3b19","name":"Trim — light trim after flowering","type":"Prune","month":"August","priority":"High","done":false,"instructions":"Trim lightly after flowering, removing spent flower stems. Never cut into old wood.","plant_url":"https://app.notion.com/p/3b9b667506ae8190ad68ca7e701383b0","url":"https://app.notion.com/p/3bab667506ae81e5a7e8d1dc188f3b19"},{"id":"3bab6675-06ae-81da-849b-f5273ffce00b","name":"Divide / Propagate — remove cormlets when dormant","type":"Divide / Propagate","month":"August","priority":"Low","done":true,"instructions":"Remove cormlets from around the parent corm when lifting or repotting in late summer. Replant immediately in fresh gritty compost at the same depth. This builds up the display over time.","plant_url":"https://app.notion.com/p/3bab667506ae815ebb19dc55ce8ca47a","url":"https://app.notion.com/p/3bab667506ae81da849bf5273ffce00b"},{"id":"3bab6675-06ae-816a-a3b2-c26a00da0437","name":"Divide / Propagate — separate bulb offsets","type":"Divide / Propagate","month":"August","priority":"Low","done":true,"instructions":"Separate bulb offsets from congested clumps between midsummer and early autumn. Replant offsets immediately at the same depth 8–10cm apart. Wear gloves — harmful if eaten.","plant_url":"https://app.notion.com/p/3bab667506ae812cb22cc4b43494acca","url":"https://app.notion.com/p/3bab667506ae816aa3b2c26a00da0437"},{"id":"3bcb6675-06ae-81f9-98cd-ce2116a908c7","name":"Other — check for disease, harvest fruit if set","type":"Other","month":"August","priority":"Medium","done":true,"instructions":"Check for signs of silver leaf (silvery sheen on leaves) and bacterial canker (sunken, weeping lesions on bark) in spring and summer. Check for peach leaf curl (red blistered leaves) as growth emerges. If fruit sets, harvest when fully coloured — edible raw or made into jam/jelly. Fruit also valuabl","plant_url":"https://app.notion.com/p/3bcb667506ae81edb67bdeeadb7881aa","url":"https://app.notion.com/p/3bcb667506ae81f998cdce2116a908c7"},{"id":"3bbb6675-06ae-8183-a64e-e52067ea4177","name":"Deadhead — remove spent flower spikes","type":"Deadhead","month":"August","priority":"Medium","done":true,"instructions":"Continue deadheading through August. Water early in the morning with a weak potash-rich fertiliser such as Tomorite to maintain flowering.","plant_url":"https://app.notion.com/p/3bbb667506ae8143b75dc5098eb49c0b","url":"https://app.notion.com/p/3bbb667506ae8183a64ee52067ea4177"},{"id":"3bab6675-06ae-81bc-9e42-dd06258eb184","name":"Tidy — cut back after flowering, assess for replacement","type":"Tidy","month":"August","priority":"Medium","done":false,"instructions":"Deadhead and tidy any remaining stems. This is a short-lived perennial — assess whether plants are still vigorous or need replacing with fresh young plants next season.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae81bc9e42dd06258eb184"},{"id":"3bab6675-06ae-8165-855d-c756d74365bb","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"August","priority":"Medium","done":true,"instructions":"Continue deadheading through late summer. Flowers may turn all-white as days shorten — this is a natural and expected colour change, not a sign of disease.","plant_url":"https://app.notion.com/p/3bab667506ae8180bca0e0ee6c8608f7","url":"https://app.notion.com/p/3bab667506ae8165855dc756d74365bb"},{"id":"3bab6675-06ae-81e3-8bc8-d65c0eb3ebc3","name":"Prune — trim after flowering","type":"Prune","month":"August","priority":"Medium","done":false,"instructions":"Trim back after flowering to keep in check. Remove any dead or weak stems.","plant_url":"https://app.notion.com/p/3b9b667506ae81d79f41e9caba330a84","url":"https://app.notion.com/p/3bab667506ae81e38bc8d65c0eb3ebc3"},{"id":"3bab6675-06ae-8113-b9ba-d45b833feda6","name":"Divide / Propagate — remove offsets when dormant","type":"Divide / Propagate","month":"December","priority":"Low","done":false,"instructions":"Remove offsets from around the base of established bulbs while dormant in winter. Replant offsets immediately at the same depth to build up clumps.","plant_url":"https://app.notion.com/p/3bab667506ae81c88507c31b8ec2e654","url":"https://app.notion.com/p/3bab667506ae8113b9bad45b833feda6"},{"id":"3c5b6675-06ae-816f-86cc-e21526f44564","name":"Prune Winter Jasmine after flowering","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Cut back all flowered shoots to a strong bud or pair of leaves. Remove any dead, damaged or overcrowded stems. Do not prune hard into old wood. Must be done immediately after flowering finishes — do not delay into summer or you will remove next year's flower buds.","plant_url":"https://app.notion.com/p/3c5b667506ae812f9e04e504fae25411","url":"https://app.notion.com/p/3c5b667506ae816f86cce21526f44564"},{"id":"3bcb6675-06ae-8114-bb8c-c3a41f64c7ca","name":"Prune — annual prune (Group 16 Floribunda)","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Prune all main stems back by a third to a half to an outward-facing bud. Remove any dead, diseased or crossing stems entirely, cutting back to healthy wood. This is the most important annual task for a floribunda rose.","plant_url":"https://app.notion.com/p/3bcb667506ae81a3a3f6ef068d66febf","url":"https://app.notion.com/p/3bcb667506ae8114bb8cc3a41f64c7ca"},{"id":"3bcb6675-06ae-8159-b7c1-f485aebd0886","name":"Prune — annual prune in early spring","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Prune back by a third to outward-facing buds. Remove any dead, diseased or crossing stems entirely. This repeat-flowering persica hybrid benefits from tidy annual pruning to maintain compact shape.","plant_url":"https://app.notion.com/p/3bcb667506ae81bea0eee3a5573d9bc8","url":"https://app.notion.com/p/3bcb667506ae8159b7c1f485aebd0886"},{"id":"3bcb6675-06ae-8186-88eb-d2dea62f345f","name":"Feed — balanced fertiliser and mulch","type":"Feed","month":"February","priority":"High","done":false,"instructions":"Apply a balanced rose fertiliser and mulch of well-rotted manure or compost around the base in late winter, keeping it away from the stem.","plant_url":"https://app.notion.com/p/3bcb667506ae81bea0eee3a5573d9bc8","url":"https://app.notion.com/p/3bcb667506ae818688ebd2dea62f345f"},{"id":"3bcb6675-06ae-8196-9ea0-f49fcb98a96e","name":"Feed — balanced fertiliser and mulch","type":"Feed","month":"February","priority":"High","done":false,"instructions":"Apply a balanced rose fertiliser and a generous mulch of well-rotted manure or compost around the base in late winter, keeping it away from the stem.","plant_url":"https://app.notion.com/p/3bcb667506ae81a3a3f6ef068d66febf","url":"https://app.notion.com/p/3bcb667506ae81969ea0f49fcb98a96e"},{"id":"3bbb6675-06ae-817f-8bd3-e881f9b29f5d","name":"Prune — prune according to group (identify first)","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Do not prune until the cultivar and pruning group has been identified in flower. Once identified: Group 1 = prune lightly after flowering; Group 2 = light prune to strong buds; Group 3 = cut back hard to 30cm above soil. Repot into fresh ericaceous or general purpose compost if not repotted in the l","plant_url":"https://app.notion.com/p/3bbb667506ae81c49560e448b1de6b29","url":"https://app.notion.com/p/3bbb667506ae817f8bd3e881f9b29f5d"},{"id":"3bbb6675-06ae-81cd-89f3-ee168d224770","name":"Plant — sow seeds indoors","type":"Plant","month":"February","priority":"High","done":false,"instructions":"Sow seed indoors at 18–20°C in trays of good quality compost, lightly covering seeds. Place in a heated propagator or warm windowsill. Pot on when first true leaves appear. Harden off before planting out after all risk of frost has passed (mid-May). Space 20–30cm apart.","plant_url":"https://app.notion.com/p/3bbb667506ae8143b75dc5098eb49c0b","url":"https://app.notion.com/p/3bbb667506ae81cd89f3ee168d224770"},{"id":"3bab6675-06ae-810a-bc24-f93bf44fdff7","name":"Prune — cut to 15–30cm late winter","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Cut all stems back to 15–30cm in late winter to encourage strong flowering stems.","plant_url":"https://app.notion.com/p/3b9b667506ae81d183deeb3f4f653bef","url":"https://app.notion.com/p/3bab667506ae810abc24f93bf44fdff7"},{"id":"3bab6675-06ae-8185-a772-f85852938c62","name":"Prune — winter prune to shape","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Winter prune to maintain open shape. Remove dead, diseased or crossing branches.","plant_url":"https://app.notion.com/p/3b9b667506ae8131b22eeacda0c0fe53","url":"https://app.notion.com/p/3bab667506ae8185a772f85852938c62"},{"id":"3bab6675-06ae-81d7-ac83-fa2f1e3ce500","name":"Prune — winter prune to shape","type":"Prune","month":"February","priority":"High","done":false,"instructions":"Winter prune to maintain shape and remove crossing branches. Thin fruit spurs if congested.","plant_url":"https://app.notion.com/p/3b9b667506ae81a78766f8e30b90c30b","url":"https://app.notion.com/p/3bab667506ae81d7ac83fa2f1e3ce500"},{"id":"3bab6675-06ae-819e-965e-d3b7da586114","name":"Prune — cut back late winter","type":"Prune","month":"February","priority":"Low","done":false,"instructions":"Cut back in late winter. Leave seedheads standing over winter for birds and wildlife.","plant_url":"https://app.notion.com/p/3b9b667506ae8118824be46356d28932","url":"https://app.notion.com/p/3bab667506ae819e965ed3b7da586114"},{"id":"3bab6675-06ae-81ac-b912-cb362806dd4d","name":"Prune — cut back late winter","type":"Prune","month":"February","priority":"Low","done":false,"instructions":"Cut back spent stems to ground level in late winter.","plant_url":"https://app.notion.com/p/3b9b667506ae8177adabfa2f80828f71","url":"https://app.notion.com/p/3bab667506ae81acb912cb362806dd4d"},{"id":"3bab6675-06ae-81e9-8e6a-f147200e825b","name":"Prune — cut back late winter","type":"Prune","month":"February","priority":"Low","done":false,"instructions":"Cut back to ground in late winter. Leave seedheads over winter for birds.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae81e98e6af147200e825b"},{"id":"3bab6675-06ae-815d-9439-e0f9284d5c68","name":"Prune — thin and remove suckers","type":"Prune","month":"February","priority":"Medium","done":false,"instructions":"Thin out old stems in late winter and remove any suckers from the base.","plant_url":"https://app.notion.com/p/3b9b667506ae8140a55cc14eea830190","url":"https://app.notion.com/p/3bab667506ae815d9439e0f9284d5c68"},{"id":"3bab6675-06ae-8160-88ad-f3607ec14211","name":"Prune — prune late winter to shape","type":"Prune","month":"February","priority":"Medium","done":false,"instructions":"Prune in late winter to shape. Wear gloves — very thorny.","plant_url":"https://app.notion.com/p/3b9b667506ae81b48b89dd1d82653506","url":"https://app.notion.com/p/3bab667506ae816088adf3607ec14211"},{"id":"3bab6675-06ae-81c2-b51e-c7ba37ca4ad7","name":"Prune — prune late winter to shape","type":"Prune","month":"February","priority":"Medium","done":false,"instructions":"Prune in late winter to shape and remove dead wood. Tolerates hard pruning.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae81c2b51ec7ba37ca4ad7"},{"id":"3bbb6675-06ae-81c9-a46f-c564bb41de33","name":"Water — keep pot well watered through summer","type":"Water","month":"July","priority":"High","done":false,"instructions":"Water regularly through July. Apply a liquid balanced fertiliser fortnightly through the growing season to compensate for nutrients leaching from the pot.","plant_url":"https://app.notion.com/p/3bbb667506ae81c49560e448b1de6b29","url":"https://app.notion.com/p/3bbb667506ae81c9a46fc564bb41de33"},{"id":"3bab6675-06ae-8142-b2ea-f774221ffc1b","name":"Prune — prune after flowering (Group 2)","type":"Prune","month":"July","priority":"High","done":false,"instructions":"Prune immediately after flowering (Pruning Group 2). Cut back flowered stems to maintain shape and encourage fresh growth. If overgrown, can be cut back hard straight after flowering to renovate. Remove suckers from the base to control spread.","plant_url":"https://app.notion.com/p/3bab667506ae81d09ce9e1307a349412","url":"https://app.notion.com/p/3bab667506ae8142b2eaf774221ffc1b"},{"id":"3bab6675-06ae-8117-b48a-cfacbd18dd32","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"July","priority":"High","done":false,"instructions":"Continue deadheading regularly through summer for continuous flowering.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae8117b48acfacbd18dd32"},{"id":"3bab6675-06ae-816d-aaa7-f74238a2fb52","name":"Harvest — pick cherries","type":"Harvest","month":"July","priority":"High","done":false,"instructions":"Harvest when fruits are deep red and come away easily. Net the tree before fruits ripen to protect from birds.","plant_url":"https://app.notion.com/p/3b9b667506ae811bb698cf0b3ff1f721","url":"https://app.notion.com/p/3bab667506ae816daaa7f74238a2fb52"},{"id":"3bab6675-06ae-8154-aeb9-e267b74f7435","name":"Feed — high-potash feed","type":"Feed","month":"July","priority":"High","done":false,"instructions":"Continue fortnightly high-potash feeds. Keep well watered in dry spells.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae8154aeb9e267b74f7435"},{"id":"3bab6675-06ae-8117-8eb0-c3d5cc0ac4ad","name":"Prune — prune mid-summer only","type":"Prune","month":"July","priority":"High","done":false,"instructions":"Prune only in mid-summer to avoid sap bleeding. Remove dead or crossing branches.","plant_url":"https://app.notion.com/p/3b9b667506ae8169bfcbf28a21b40673","url":"https://app.notion.com/p/3bab667506ae81178eb0c3d5cc0ac4ad"},{"id":"3bab6675-06ae-8158-86d9-f909db035e4e","name":"Prune — prune after flowering","type":"Prune","month":"July","priority":"High","done":false,"instructions":"Prune immediately after flowering. Tie in new long shoots to the support structure.","plant_url":"https://app.notion.com/p/3b9b667506ae81358ed1d2d3e88ac914","url":"https://app.notion.com/p/3bab667506ae815886d9f909db035e4e"},{"id":"3bab6675-06ae-8194-a304-c4546b01e66d","name":"Prune — prune after harvest","type":"Prune","month":"July","priority":"High","done":false,"instructions":"Prune only after harvest (never in winter). Remove dead wood and maintain shape.","plant_url":"https://app.notion.com/p/3b9b667506ae811bb698cf0b3ff1f721","url":"https://app.notion.com/p/3bab667506ae8194a304c4546b01e66d"},{"id":"3bcb6675-06ae-812f-ae27-e0f9b25a66b4","name":"Divide / Propagate — semi-ripe cuttings","type":"Divide / Propagate","month":"July","priority":"Low","done":false,"instructions":"Take semi-ripe cuttings from non-flowering shoots in summer. Root in free-draining compost.","plant_url":"https://app.notion.com/p/3bcb667506ae81229248d7f5482a5ce5","url":"https://app.notion.com/p/3bcb667506ae812fae27e0f9b25a66b4"},{"id":"3bcb6675-06ae-81b0-abcc-fbb242119f51","name":"Divide / Propagate — semi-ripe cuttings","type":"Divide / Propagate","month":"July","priority":"Low","done":false,"instructions":"Take semi-ripe cuttings from non-flowering shoots in summer. Root in free-draining compost. A very easy plant to propagate — useful for filling gaps or giving plants away.","plant_url":"https://app.notion.com/p/3b9b667506ae8119a11ae0f94858954b","url":"https://app.notion.com/p/3bcb667506ae81b0abccfbb242119f51"},{"id":"3bab6675-06ae-816d-92a3-d3eeef178a5b","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"July","priority":"Low","done":false,"instructions":"Remove faded blooms to tidy, though most ramblers are once-flowering so hips will form naturally.","plant_url":"https://app.notion.com/p/3b9b667506ae81358ed1d2d3e88ac914","url":"https://app.notion.com/p/3bab667506ae816d92a3d3eeef178a5b"},{"id":"3bab6675-06ae-810a-857c-cd479e9947f7","name":"Prune — minimal prune mid-summer","type":"Prune","month":"July","priority":"Low","done":false,"instructions":"Remove dead or crossing branches in mid-summer only. Minimal intervention needed.","plant_url":"https://app.notion.com/p/3b9b667506ae81acb51ce8675a36271e","url":"https://app.notion.com/p/3bab667506ae810a857ccd479e9947f7"},{"id":"3bcb6675-06ae-8148-af48-e4ba5b54c927","name":"Prune — restrict size after flowering if needed (Group 11)","type":"Prune","month":"July","priority":"Medium","done":false,"instructions":"Prune Group 11 — prune only if needed to restrict size or remove dead, damaged or crossing growth. Do this immediately after flowering in July. Avoid heavy pruning as this significantly reduces next year's flowering. Generally best left to grow freely.","plant_url":"https://app.notion.com/p/3bcb667506ae81909de8d293d68a7157","url":"https://app.notion.com/p/3bcb667506ae8148af48e4ba5b54c927"},{"id":"3bcb6675-06ae-8153-aa7e-deb7ef2c6ff1","name":"Deadhead — remove spent blooms throughout season","type":"Deadhead","month":"July","priority":"Medium","done":false,"instructions":"Deadhead spent flower clusters throughout the season by cutting back to the first leaf with five leaflets. This encourages repeat flowering and prevents the plant setting hips.","plant_url":"https://app.notion.com/p/3bcb667506ae81a3a3f6ef068d66febf","url":"https://app.notion.com/p/3bcb667506ae8153aa7edeb7ef2c6ff1"},{"id":"3bcb6675-06ae-81ae-aa5b-e629f9d82f87","name":"Deadhead — remove spent blooms throughout season","type":"Deadhead","month":"July","priority":"Medium","done":false,"instructions":"Deadhead spent blooms throughout the season to encourage continuous repeat flowering. Cut back to the first leaf with five leaflets below the spent flower.","plant_url":"https://app.notion.com/p/3bcb667506ae81bea0eee3a5573d9bc8","url":"https://app.notion.com/p/3bcb667506ae81aeaa5be629f9d82f87"},{"id":"3bcb6675-06ae-8129-a14c-cf028f0be135","name":"Prune — mid-summer only if silver leaf present (Group 1)","type":"Prune","month":"July","priority":"Medium","done":false,"instructions":"Only prune if silver leaf disease is present. If so, cut back affected branches to healthy wood in mid-summer when the tree is in full leaf and the wound can seal quickly. Never prune in winter — this significantly increases the risk of silver leaf and bacterial canker entering through pruning cuts.","plant_url":"https://app.notion.com/p/3bcb667506ae81edb67bdeeadb7881aa","url":"https://app.notion.com/p/3bcb667506ae8129a14ccf028f0be135"},{"id":"3bbb6675-06ae-81eb-a829-eefc565ab519","name":"Tidy — deadhead, leave some to self-seed","type":"Tidy","month":"July","priority":"Medium","done":false,"instructions":"Remove most spent flower stems after flowering to tidy the plant. Leave 1–2 stems to set seed and self-sow — this is key to maintaining the colony as it is short-lived. Divide any congested clumps at the same time.","plant_url":"https://app.notion.com/p/3bbb667506ae81eabb75f05fd431c9cd","url":"https://app.notion.com/p/3bbb667506ae81eba829eefc565ab519"},{"id":"3bbb6675-06ae-81b0-944a-cc7544f2acdf","name":"Deadhead — remove spent flower spikes","type":"Deadhead","month":"July","priority":"Medium","done":false,"instructions":"Deadhead regularly throughout summer to encourage continuous flowering and prevent the plant putting energy into seed production. Cut spent spikes back to a side shoot.","plant_url":"https://app.notion.com/p/3bbb667506ae8143b75dc5098eb49c0b","url":"https://app.notion.com/p/3bbb667506ae81b0944acc7544f2acdf"},{"id":"3bbb6675-06ae-8117-a06b-dd614921252c","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"July","priority":"Medium","done":false,"instructions":"Deadhead regularly from midsummer onwards to keep flowering continuously through to autumn.","plant_url":"","url":"https://app.notion.com/p/3bbb667506ae8117a06bdd614921252c"},{"id":"3bbb6675-06ae-8196-ae2a-fb121969795f","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"July","priority":"Medium","done":false,"instructions":"Deadhead regularly from midsummer onwards to keep flowering continuously through to autumn.","plant_url":"","url":"https://app.notion.com/p/3bbb667506ae8196ae2afb121969795f"},{"id":"3bab6675-06ae-819d-b964-f8398093500b","name":"Tidy — remove dead foliage after summer dormancy","type":"Tidy","month":"July","priority":"Medium","done":false,"instructions":"Once foliage has turned straw-brown and is fully dead, pull it away cleanly. Do not cut back while still green as this weakens the bulb. The plant is summer dormant so the gap left is normal.","plant_url":"https://app.notion.com/p/3bab667506ae812cb22cc4b43494acca","url":"https://app.notion.com/p/3bab667506ae819db964f8398093500b"},{"id":"3bab6675-06ae-813d-8351-fb3831e6ef52","name":"Prune — cut down spent flower spikes","type":"Prune","month":"July","priority":"Medium","done":false,"instructions":"Cut down spent flower spikes to the base after flowering. Leave foliage to die back naturally — do not cut back until fully yellowed. Consider placing a marker where the plant is so you avoid accidentally digging into the brittle roots when the foliage has gone.","plant_url":"https://app.notion.com/p/3bab667506ae81678c0fc6ca5c19226c","url":"https://app.notion.com/p/3bab667506ae813d8351fb3831e6ef52"},{"id":"3bab6675-06ae-8121-815f-fdd07c10460e","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"July","priority":"Medium","done":false,"instructions":"Continue deadheading. Flowers will change from pure red to bicolour red/white this month — this is normal. Keep deadheading to prolong display.","plant_url":"https://app.notion.com/p/3bab667506ae8180bca0e0ee6c8608f7","url":"https://app.notion.com/p/3bab667506ae8121815ffdd07c10460e"},{"id":"3bab6675-06ae-811f-9455-f6f6959c9b30","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"July","priority":"Medium","done":false,"instructions":"Continue deadheading through summer. Allow some seedheads to remain if self-seeding is welcome.","plant_url":"https://app.notion.com/p/3b9b667506ae8171a48cf18c6181518f","url":"https://app.notion.com/p/3bab667506ae811f9455f6f6959c9b30"},{"id":"3bab6675-06ae-81f2-9173-ce6ca83a2a29","name":"Prune — cut fans after bloom","type":"Prune","month":"July","priority":"Medium","done":false,"instructions":"Cut back leaves to a fan shape after flowering. Expose rhizomes to sun to ripen.","plant_url":"https://app.notion.com/p/3b9b667506ae81b3bf62efa71934012e","url":"https://app.notion.com/p/3bab667506ae81f29173ce6ca83a2a29"},{"id":"3bbb6675-06ae-8107-a297-d0384c47896a","name":"Deadhead — cut back spent spikes for second flush","type":"Deadhead","month":"June","priority":"High","done":false,"instructions":"Deadhead spent flower spikes promptly as soon as they fade — cutting back to a pair of leaves will encourage a reliable second flush of flowers later in summer.","plant_url":"https://app.notion.com/p/3bbb667506ae81819468cad9e8e46e61","url":"https://app.notion.com/p/3bbb667506ae8107a297d0384c47896a"},{"id":"3bbb6675-06ae-81aa-b610-f8db5e29b9c3","name":"Water — keep pot well watered through summer","type":"Water","month":"June","priority":"High","done":false,"instructions":"Clematis in pots dry out quickly — check moisture daily in warm weather and water thoroughly. Do not allow to dry out completely as this stresses the plant and can trigger clematis wilt. Water at the base rather than over the foliage.","plant_url":"https://app.notion.com/p/3bbb667506ae81c49560e448b1de6b29","url":"https://app.notion.com/p/3bbb667506ae81aab610f8db5e29b9c3"},{"id":"3bbb6675-06ae-81f2-b689-d870c241e7f2","name":"Feed — ericaceous fertiliser","type":"Feed","month":"June","priority":"High","done":false,"instructions":"Second application of ericaceous fertiliser. Do not feed after this point in the season.","plant_url":"https://app.notion.com/p/3bbb667506ae8185abfbc8576ecceb4c","url":"https://app.notion.com/p/3bbb667506ae81f2b689d870c241e7f2"},{"id":"3bab6675-06ae-815c-a886-e23867a86ff5","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"June","priority":"High","done":false,"instructions":"Regularly deadhead faded blooms to keep plants flowering. Cut back to a set of leaves, not just below the flower.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae815ca886e23867a86ff5"},{"id":"3bab6675-06ae-8159-be06-f4b6f61aa79a","name":"Feed — high-potash feed","type":"Feed","month":"June","priority":"High","done":false,"instructions":"Continue fortnightly high-potash feeds through summer to maximise flowering.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae8159be06f4b6f61aa79a"},{"id":"3bab6675-06ae-8195-a007-f929494e8848","name":"Feed — ericaceous fertiliser","type":"Feed","month":"June","priority":"High","done":false,"instructions":"Second application of ericaceous fertiliser. Do not feed after July as this encourages soft growth susceptible to frost.","plant_url":"https://app.notion.com/p/3b9b667506ae8118b4fec7dd27a30e4c","url":"https://app.notion.com/p/3bab667506ae8195a007f929494e8848"},{"id":"3bab6675-06ae-819e-8113-c74507a5d95a","name":"Feed — ericaceous fertiliser","type":"Feed","month":"June","priority":"High","done":false,"instructions":"Second ericaceous feed in June. Do not feed after midsummer.","plant_url":"https://app.notion.com/p/3b9b667506ae811cae1cf5a16bcc9c5a","url":"https://app.notion.com/p/3bab667506ae819e8113c74507a5d95a"},{"id":"3bab6675-06ae-8145-af20-c9d04830411a","name":"Prune — thin fruit","type":"Prune","month":"June","priority":"High","done":false,"instructions":"Thin fruit to one per cluster in late May/early June to improve size and quality.","plant_url":"https://app.notion.com/p/3b9b667506ae81f0b55ddb6791732109","url":"https://app.notion.com/p/3bab667506ae8145af20c9d04830411a"},{"id":"3bbb6675-06ae-812c-8019-f101e9fec789","name":"Feed — potash-rich liquid feed","type":"Feed","month":"June","priority":"Low","done":false,"instructions":"Water with a weak solution of potash-rich fertiliser (such as Tomorite) early in the morning through the growing season to encourage strong flowering growth.","plant_url":"https://app.notion.com/p/3bbb667506ae8143b75dc5098eb49c0b","url":"https://app.notion.com/p/3bbb667506ae812c8019f101e9fec789"},{"id":"3bab6675-06ae-812e-9b26-fbffea895ac8","name":"Divide / Propagate — softwood cuttings or divide suckers","type":"Divide / Propagate","month":"June","priority":"Low","done":false,"instructions":"Take softwood cuttings from non-flowering shoots in early summer if propagation is wanted. Root in free-draining compost. Alternatively divide rooted suckers in autumn or spring.","plant_url":"https://app.notion.com/p/3bab667506ae81d09ce9e1307a349412","url":"https://app.notion.com/p/3bab667506ae812e9b26fbffea895ac8"},{"id":"3bab6675-06ae-811a-9da4-e95f69384018","name":"Divide / Propagate — take cuttings","type":"Divide / Propagate","month":"June","priority":"Low","done":false,"instructions":"Take softwood cuttings in summer to propagate new plants for next year. Root in free-draining compost.","plant_url":"https://app.notion.com/p/3b9b667506ae81aa8933d1ca6335efe1","url":"https://app.notion.com/p/3bab667506ae811a9da4e95f69384018"},{"id":"3bab6675-06ae-81fd-9270-fa8ac0c8a542","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"June","priority":"Low","done":false,"instructions":"Deadhead spent flowers through summer. Note: leaving some will produce ornamental hips for autumn wildlife interest.","plant_url":"https://app.notion.com/p/3b9b667506ae8140a55cc14eea830190","url":"https://app.notion.com/p/3bab667506ae81fd9270fa8ac0c8a542"},{"id":"3bcb6675-06ae-8119-a195-f2bf32ba3564","name":"Feed — second feed early summer","type":"Feed","month":"June","priority":"Medium","done":false,"instructions":"Apply a second balanced rose fertiliser feed in early summer to support continuous repeat flowering through to autumn.","plant_url":"https://app.notion.com/p/3bcb667506ae81bea0eee3a5573d9bc8","url":"https://app.notion.com/p/3bcb667506ae8119a195f2bf32ba3564"},{"id":"3bcb6675-06ae-8182-a5c8-e822fdc5c516","name":"Feed — second feed early summer","type":"Feed","month":"June","priority":"Medium","done":false,"instructions":"Apply a second feed of balanced rose fertiliser in early summer to support the repeat-flowering season.","plant_url":"https://app.notion.com/p/3bcb667506ae81a3a3f6ef068d66febf","url":"https://app.notion.com/p/3bcb667506ae8182a5c8e822fdc5c516"},{"id":"3bcb6675-06ae-8199-b6fd-fc62fe41357d","name":"Other — check for blackspot, mildew and rust","type":"Other","month":"June","priority":"Medium","done":false,"instructions":"Check for blackspot (black spots on leaves), powdery mildew (white powder on shoots) and rust (orange pustules under leaves). Treat promptly with appropriate fungicide if needed. Remove and bin affected leaves — do not compost.","plant_url":"https://app.notion.com/p/3bcb667506ae81a3a3f6ef068d66febf","url":"https://app.notion.com/p/3bcb667506ae8199b6fdfc62fe41357d"},{"id":"3bcb6675-06ae-81f5-a7d1-e527a9b49a99","name":"Other — check for pests and disease","type":"Other","month":"June","priority":"Medium","done":false,"instructions":"Check for aphids, blackspot, powdery mildew and red spider mite. Treat promptly if needed. Remove and bin affected leaves.","plant_url":"https://app.notion.com/p/3bcb667506ae81bea0eee3a5573d9bc8","url":"https://app.notion.com/p/3bcb667506ae81f5a7d1e527a9b49a99"},{"id":"3bbb6675-06ae-810b-bf0c-fbc75029db2a","name":"Deadhead — remove spent blooms, feed fortnightly","type":"Deadhead","month":"June","priority":"Medium","done":false,"instructions":"Deadhead spent blooms regularly to encourage continuous flowering. Apply a high-potash liquid feed (such as Tomorite) fortnightly through summer.","plant_url":"https://app.notion.com/p/3bbb667506ae8117a205cf1a83335f01","url":"https://app.notion.com/p/3bbb667506ae810bbf0cfbc75029db2a"},{"id":"3bbb6675-06ae-81ee-8f6a-d1a931b5b315","name":"Deadhead — remove spent blooms, feed fortnightly","type":"Deadhead","month":"June","priority":"Medium","done":false,"instructions":"Deadhead spent blooms regularly to encourage continuous flowering. Apply a high-potash liquid feed (such as Tomorite) fortnightly through summer.","plant_url":"https://app.notion.com/p/3bbb667506ae817cba78df2e09e34e41","url":"https://app.notion.com/p/3bbb667506ae81ee8f6ad1a931b5b315"},{"id":"3bab6675-06ae-813c-b044-df19733f5b22","name":"Deadhead — remove spent flower clusters","type":"Deadhead","month":"June","priority":"Medium","done":false,"instructions":"Deadhead regularly throughout the flowering season to extend blooms. Cut individual spent flower clusters back to a leaf joint.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae813cb044df19733f5b22"},{"id":"3bab6675-06ae-8189-a7c0-d7085b37398e","name":"Tidy — cut back faded flower spikes","type":"Tidy","month":"June","priority":"Medium","done":false,"instructions":"Cut back faded flower spikes after flowering. Deadhead before seed sets if you want to prevent self-seeding and spread. Allow foliage to die back naturally before removing.","plant_url":"https://app.notion.com/p/3bab667506ae81c88507c31b8ec2e654","url":"https://app.notion.com/p/3bab667506ae8189a7c0d7085b37398e"},{"id":"3bab6675-06ae-810b-918d-e67f43f9e009","name":"Tidy — allow foliage to die back","type":"Tidy","month":"June","priority":"Medium","done":false,"instructions":"Leave foliage completely alone after flowering. Allow leaves to die back fully before removing — this feeds the bulb for next year. Remove only once fully yellow and papery.","plant_url":"https://app.notion.com/p/3bab667506ae81fe9bf0ef1d638c0677","url":"https://app.notion.com/p/3bab667506ae810b918de67f43f9e009"},{"id":"3bab6675-06ae-818c-9333-eb0beaa252f7","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"June","priority":"Medium","done":false,"instructions":"Deadhead regularly from early summer to prolong flowering into autumn. The plant flowers continuously until first frost if kept deadheaded.","plant_url":"https://app.notion.com/p/3bab667506ae8180bca0e0ee6c8608f7","url":"https://app.notion.com/p/3bab667506ae818c9333eb0beaa252f7"},{"id":"3bab6675-06ae-8121-920f-fb46b6e2253e","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"June","priority":"Medium","done":false,"instructions":"Deadhead regularly to extend flowering season. Self-seeds prolifically so deadhead before seeds set if spread is unwanted.","plant_url":"https://app.notion.com/p/3b9b667506ae8171a48cf18c6181518f","url":"https://app.notion.com/p/3bab667506ae8121920ffb46b6e2253e"},{"id":"3bab6675-06ae-81ca-b9aa-f24a473e8c31","name":"Deadhead — remove spent blooms","type":"Deadhead","month":"June","priority":"Medium","done":false,"instructions":"Deadhead regularly after first flush to encourage further flowering into late summer.","plant_url":"https://app.notion.com/p/3b9b667506ae813db7b3d95bbbb938d1","url":"https://app.notion.com/p/3bab667506ae81cab9aaf24a473e8c31"},{"id":"3bab6675-06ae-8116-abe6-cf1c2afbbefb","name":"Feed — tomato fertiliser","type":"Feed","month":"June","priority":"Medium","done":false,"instructions":"Feed with a tomato or high-potash liquid fertiliser fortnightly through summer to encourage fruiting.","plant_url":"https://app.notion.com/p/3b9b667506ae818eae25ec532b33fddb","url":"https://app.notion.com/p/3bab667506ae8116abe6cf1c2afbbefb"},{"id":"3bab6675-06ae-8124-917e-e31ef189625b","name":"Feed — rose fertiliser","type":"Feed","month":"June","priority":"Medium","done":false,"instructions":"Second feed with rose fertiliser after first flush of flowers to encourage repeat blooming.","plant_url":"https://app.notion.com/p/3b9b667506ae8140a55cc14eea830190","url":"https://app.notion.com/p/3bab667506ae8124917ee31ef189625b"},{"id":"3bab6675-06ae-81ab-86b7-d0ec690f8fb2","name":"Feed — ericaceous fertiliser","type":"Feed","month":"June","priority":"Medium","done":false,"instructions":"Second ericaceous feed for the season.","plant_url":"https://app.notion.com/p/3b9b667506ae817193e0e2eda211ca02","url":"https://app.notion.com/p/3bab667506ae81ab86b7d0ec690f8fb2"},{"id":"3bab6675-06ae-8104-be0a-eca826de37a4","name":"Prune — shear after flowering","type":"Prune","month":"June","priority":"Medium","done":false,"instructions":"Shear back after first flush to encourage fresh growth and a second flush of flowers.","plant_url":"https://app.notion.com/p/3b9b667506ae813db7b3d95bbbb938d1","url":"https://app.notion.com/p/3bab667506ae8104be0aeca826de37a4"},{"id":"3bab6675-06ae-81cb-a2ab-e7976bba3b03","name":"Prune — deadhead spent spikes","type":"Prune","month":"June","priority":"Medium","done":false,"instructions":"Deadhead after first flush to encourage a second. Cut back fully in September.","plant_url":"https://app.notion.com/p/3b9b667506ae81b6889fcd37dba5c0cc","url":"https://app.notion.com/p/3bab667506ae81cba2abe7976bba3b03"},{"id":"3bbb6675-06ae-81bb-9c61-fcde460b995e","name":"Prune — cut back hard in early spring","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Cut back hard to just above ground level in early spring before new growth emerges. This keeps the plant compact and vigorous. Do not prune in autumn.","plant_url":"https://app.notion.com/p/3bbb667506ae81819468cad9e8e46e61","url":"https://app.notion.com/p/3bbb667506ae81bb9c61fcde460b995e"},{"id":"3bbb6675-06ae-8114-9ba4-ceb99c3b68bc","name":"Plant — start tubers indoors, plant out after frost","type":"Plant","month":"March","priority":"High","done":false,"instructions":"Start tubers into growth indoors in March in barely moist compost at 18–20°C. Plant out after all frost risk has passed in mid-May. Space 20–30cm apart.","plant_url":"https://app.notion.com/p/3bbb667506ae817cba78df2e09e34e41","url":"https://app.notion.com/p/3bbb667506ae81149ba4ceb99c3b68bc"},{"id":"3bbb6675-06ae-8125-a924-f6f7983499e4","name":"Prune — spring prune (Group 9)","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Wait until all frost risk has passed (mid-May), then prune back hard to healthy buds. Pruning Group 9 — never prune in autumn.","plant_url":"https://app.notion.com/p/3bbb667506ae8142a2abcfe5e4241b0e","url":"https://app.notion.com/p/3bbb667506ae8125a924f6f7983499e4"},{"id":"3bbb6675-06ae-816a-b584-d817f06190c7","name":"Prune — spring prune (Group 9)","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Wait until all frost risk has passed (mid-May), then prune back to healthy buds. Pruning Group 9 — do not prune in autumn as old stems offer some frost protection.","plant_url":"https://app.notion.com/p/3bbb667506ae81a1abacf15c0e474488","url":"https://app.notion.com/p/3bbb667506ae816ab584d817f06190c7"},{"id":"3bbb6675-06ae-81d6-b721-cbef1c70b596","name":"Plant — start tubers indoors, plant out after frost","type":"Plant","month":"March","priority":"High","done":false,"instructions":"Start tubers into growth indoors in March in barely moist compost at 18–20°C. Plant out after all frost risk has passed in mid-May. Space 20–30cm apart.","plant_url":"https://app.notion.com/p/3bbb667506ae8117a205cf1a83335f01","url":"https://app.notion.com/p/3bbb667506ae81d6b721cbef1c70b596"},{"id":"3bbb6675-06ae-810e-ad15-f3a775a74b6f","name":"Prune — spring prune (Pruning Group 9)","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Wait until risk of frost has passed then prune back hard to healthy buds, removing any frost-damaged or dead stems. Pruning Group 9 — do not prune in autumn.","plant_url":"","url":"https://app.notion.com/p/3bbb667506ae810ead15f3a775a74b6f"},{"id":"3bbb6675-06ae-8179-a20d-ef2c9ebc71fc","name":"Prune — spring prune (Pruning Group 9)","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Wait until risk of frost has passed then prune back hard to healthy buds, removing any frost-damaged or dead stems. Pruning Group 9 — do not prune in autumn.","plant_url":"","url":"https://app.notion.com/p/3bbb667506ae8179a20def2c9ebc71fc"},{"id":"3bab6675-06ae-81a9-b3c5-f3c253e77fca","name":"Frost Protection — protect emerging shoots from late frost","type":"Frost Protection","month":"March","priority":"High","done":false,"instructions":"As soon as shoots emerge in late winter/early spring, check the forecast. If frost is expected, cover shoots with horticultural fleece overnight — young growth is vulnerable even though the plant itself is H6. Remove fleece during the day.","plant_url":"https://app.notion.com/p/3bab667506ae81678c0fc6ca5c19226c","url":"https://app.notion.com/p/3bab667506ae81a9b3c5f3c253e77fca"},{"id":"3bab6675-06ae-81ac-a822-d65520f8599b","name":"Mulch — mulch around base","type":"Mulch","month":"March","priority":"High","done":false,"instructions":"Apply a mulch of well-rotted leaf mould or bark around the base in spring, keeping it away from the trunk. This retains moisture and protects shallow roots. Magnolias are shallow-rooted so avoid disturbing the soil around the base.","plant_url":"https://app.notion.com/p/3bab667506ae81a693a6dd07b9cebcbd","url":"https://app.notion.com/p/3bab667506ae81aca822d65520f8599b"},{"id":"3bab6675-06ae-8105-b020-cd991c5380b9","name":"Prune — spring prune (Pruning Group 9)","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Wait until risk of frost has passed then prune back hard to healthy buds, removing any frost-damaged or dead stems. Do not prune in autumn as this increases frost risk. RHS Pruning Group 9.","plant_url":"https://app.notion.com/p/3bab667506ae8180bca0e0ee6c8608f7","url":"https://app.notion.com/p/3bab667506ae8105b020cd991c5380b9"},{"id":"3bab6675-06ae-815a-bf93-e8e3925ce22c","name":"Mulch — mulch around base","type":"Mulch","month":"March","priority":"High","done":false,"instructions":"Apply ericaceous compost or leaf mould as a mulch to retain moisture and maintain soil acidity.","plant_url":"https://app.notion.com/p/3b9b667506ae81df80d7dabf7eee7369","url":"https://app.notion.com/p/3bab667506ae815abf93e8e3925ce22c"},{"id":"3bab6675-06ae-81b6-9eae-d9663aae0575","name":"Mulch — mulch around base","type":"Mulch","month":"March","priority":"High","done":false,"instructions":"Apply ericaceous compost or leaf mould as a mulch around the base to maintain acidity and retain moisture.","plant_url":"https://app.notion.com/p/3b9b667506ae8118b4fec7dd27a30e4c","url":"https://app.notion.com/p/3bab667506ae81b69eaed9663aae0575"},{"id":"3bab6675-06ae-81fb-9f48-e8a6db7392bf","name":"Mulch — apply around base","type":"Mulch","month":"March","priority":"High","done":false,"instructions":"Apply a 5–10cm layer of well-rotted garden compost or bark mulch across all beds in early spring. Keep mulch away from plant stems and crowns. This retains moisture, suppresses weeds and feeds the soil.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae81fb9f48e8a6db7392bf"},{"id":"3bab6675-06ae-8137-9156-c1b55d0df70a","name":"Feed — potash-rich fertiliser","type":"Feed","month":"March","priority":"High","done":false,"instructions":"Apply a potash-rich fertiliser in early spring. Avoid high-nitrogen feeds which promote leaf at the expense of fruit.","plant_url":"https://app.notion.com/p/3b9b667506ae811bb698cf0b3ff1f721","url":"https://app.notion.com/p/3bab667506ae81379156c1b55d0df70a"},{"id":"3bab6675-06ae-8172-b588-d53d357a51fe","name":"Feed — potash-rich fertiliser","type":"Feed","month":"March","priority":"High","done":false,"instructions":"Apply a potash-rich fertiliser around the base in early spring to support fruit development. Water in well.","plant_url":"https://app.notion.com/p/3b9b667506ae8131b22eeacda0c0fe53","url":"https://app.notion.com/p/3bab667506ae8172b588d53d357a51fe"},{"id":"3bab6675-06ae-8185-b65c-cdb3d7e52a2d","name":"Feed — potash-rich fertiliser","type":"Feed","month":"March","priority":"High","done":false,"instructions":"Apply a potash-rich fertiliser (e.g. sulphate of potash) around the base. Keep away from the trunk. Follow with a good watering.","plant_url":"https://app.notion.com/p/3b9b667506ae81a78766f8e30b90c30b","url":"https://app.notion.com/p/3bab667506ae8185b65ccdb3d7e52a2d"},{"id":"3bab6675-06ae-81cf-a4d7-dd2638bf6ce9","name":"Feed — potash-rich fertiliser","type":"Feed","month":"March","priority":"High","done":false,"instructions":"Feed with a potash-rich fertiliser in early spring. Also feed with a balanced fertiliser in midsummer after fruiting.","plant_url":"https://app.notion.com/p/3b9b667506ae81f0b55ddb6791732109","url":"https://app.notion.com/p/3bab667506ae81cfa4d7dd2638bf6ce9"},{"id":"3bab6675-06ae-81c8-a2e4-efb931832f22","name":"Prune — hard prune early spring","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Hard prune to 30–50cm in early spring to encourage strong new flowering stems.","plant_url":"https://app.notion.com/p/3b9b667506ae81929e3ac20f4549c114","url":"https://app.notion.com/p/3bab667506ae81c8a2e4efb931832f22"},{"id":"3bab6675-06ae-81e7-aa80-cd355c752286","name":"Prune — cut back","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Hard prune to 30–50cm in early spring to encourage strong new growth and flowers. Deadhead during summer to reduce self-seeding.","plant_url":"https://app.notion.com/p/3b9b667506ae81da929efefe97cc7b33","url":"https://app.notion.com/p/3bab667506ae81e7aa80cd355c752286"},{"id":"3bab6675-06ae-81ec-ad36-e0fbe15d1567","name":"Prune — hard prune","type":"Prune","month":"March","priority":"High","done":false,"instructions":"Hard prune in early spring, cutting old stems to 30–50cm above ground. Wear gloves and protective clothing — leaves are very sharp.","plant_url":"https://app.notion.com/p/3b9b667506ae81db972de8e27c65a318","url":"https://app.notion.com/p/3bab667506ae81ecad36e0fbe15d1567"},{"id":"3bcb6675-06ae-81e8-9e03-f8acc385c236","name":"Feed — balanced fertiliser in spring","type":"Feed","month":"March","priority":"Low","done":false,"instructions":"Apply a balanced fertiliser in spring as new growth emerges. Once established this plant is largely self-sufficient but benefits from feeding in the early years.","plant_url":"https://app.notion.com/p/3bcb667506ae81909de8d293d68a7157","url":"https://app.notion.com/p/3bcb667506ae81e89e03f8acc385c236"},{"id":"3bbb6675-06ae-8194-bfdb-e0e659b45005","name":"Divide / Propagate — divide or take cuttings","type":"Divide / Propagate","month":"March","priority":"Low","done":false,"instructions":"Divide clumps in spring every 3–4 years to maintain vigour. Take semi-ripe cuttings in summer if propagation is wanted.","plant_url":"https://app.notion.com/p/3bbb667506ae81819468cad9e8e46e61","url":"https://app.notion.com/p/3bbb667506ae8194bfdbe0e659b45005"},{"id":"3bbb6675-06ae-810b-9d45-d5f0e7b3b284","name":"Divide / Propagate — divide congested clumps in spring","type":"Divide / Propagate","month":"March","priority":"Low","done":false,"instructions":"Divide congested clumps in early spring before growth is too advanced. Replant divisions immediately in moist humus-rich soil in partial shade. Water in thoroughly.","plant_url":"https://app.notion.com/p/3bbb667506ae81eabb75f05fd431c9cd","url":"https://app.notion.com/p/3bbb667506ae810b9d45d5f0e7b3b284"},{"id":"3bab6675-06ae-812b-8a8d-cf83d51bb430","name":"Feed — bulb fertiliser","type":"Feed","month":"March","priority":"Low","done":false,"instructions":"Apply a balanced bulb fertiliser as shoots emerge in spring to support strong flowering.","plant_url":"https://app.notion.com/p/3bab667506ae812cb22cc4b43494acca","url":"https://app.notion.com/p/3bab667506ae812b8a8dcf83d51bb430"},{"id":"3bab6675-06ae-8158-b11e-c560e9c5439b","name":"Feed — bulb fertiliser","type":"Feed","month":"March","priority":"Low","done":false,"instructions":"Apply a balanced bulb fertiliser as shoots emerge in spring to support flowering and build bulb strength for next year.","plant_url":"https://app.notion.com/p/3bab667506ae81fe9bf0ef1d638c0677","url":"https://app.notion.com/p/3bab667506ae8158b11ec560e9c5439b"},{"id":"3bab6675-06ae-81e0-a4ed-f9d3a6565ce3","name":"Feed — bulb fertiliser","type":"Feed","month":"March","priority":"Low","done":false,"instructions":"Apply a balanced bulb fertiliser as shoots emerge to support flowering and build bulb strength for next year.","plant_url":"https://app.notion.com/p/3bab667506ae81dd8159efdb1b535a6f","url":"https://app.notion.com/p/3bab667506ae81e0a4edf9d3a6565ce3"},{"id":"3bab6675-06ae-8136-8b0a-f2273b36ce97","name":"Mulch — mulch around base","type":"Mulch","month":"March","priority":"Low","done":false,"instructions":"Apply a light layer of grit or gravel mulch around the base to improve drainage and retain warmth. Avoid heavy organic mulch directly against the stems.","plant_url":"https://app.notion.com/p/3bab667506ae8180bca0e0ee6c8608f7","url":"https://app.notion.com/p/3bab667506ae81368b0af2273b36ce97"},{"id":"3bab6675-06ae-81e2-82d4-de6938a4ce5e","name":"Divide / Propagate — divide clumps","type":"Divide / Propagate","month":"March","priority":"Low","done":false,"instructions":"Divide congested clumps in early spring before growth gets underway. Replant divisions and water in well.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae81e282d4de6938a4ce5e"},{"id":"3bab6675-06ae-8105-90b9-d05b2bd2b892","name":"Feed — general fertiliser","type":"Feed","month":"March","priority":"Low","done":false,"instructions":"Mulch with garden compost in spring. Light feeding with a balanced fertiliser if soil is poor.","plant_url":"https://app.notion.com/p/3b9b667506ae8146bac6c9cf48c33724","url":"https://app.notion.com/p/3bab667506ae810590b9d05b2bd2b892"},{"id":"3bab6675-06ae-8184-86d3-db24139266b2","name":"Feed — general balanced fertiliser","type":"Feed","month":"March","priority":"Low","done":false,"instructions":"Apply a balanced slow-release fertiliser around the base in early spring as growth starts.","plant_url":"","url":"https://app.notion.com/p/3bab667506ae818486d3db24139266b2"},{"id":"3bab6675-06ae-81a6-a1c0-d4a639c4990a","name":"Prune — light trim after flowering","type":"Prune","month":"March","priority":"Low","done":false,"instructions":"Light prune in late winter or after flowering to maintain shape.","plant_url":"https://app.notion.com/p/3b9b667506ae815a837ae38f987b282b","url":"https://app.notion.com/p/3bab667506ae81a6a1c0d4a639c4990a"},{"id":"3bab6675-06ae-81c7-8f89-cb7842fc2b98","name":"Prune — light prune in spring","type":"Prune","month":"March","priority":"Low","done":false,"instructions":"Light prune in spring to shape and remove dead wood. Avoid hard pruning.","plant_url":"https://app.notion.com/p/3b9b667506ae818eae25ec532b33fddb","url":"https://app.notion.com/p/3bab667506ae81c78f89cb7842fc2b98"},{"id":"3bcb6675-06ae-8141-96a1-ca9750abf1a2","name":"Mulch — mulch around base in spring","type":"Mulch","month":"March","priority":"Medium","done":false,"instructions":"Apply a generous mulch of well-rotted compost or leaf mould around the base each spring, keeping it away from the stem. This retains moisture and feeds the soil — particularly important in the first few years while establishing.","plant_url":"https://app.notion.com/p/3bcb667506ae81909de8d293d68a7157","url":"https://app.notion.com/p/3bcb667506ae814196a1ca9750abf1a2"},{"id":"3bcb6675-06ae-816e-99c2-f956bd3806e5","name":"Prune — cut back by a third in early spring","type":"Prune","month":"March","priority":"Medium","done":false,"instructions":"Cut back by approximately a third in early spring before new growth gets underway. Maintains a good shape and encourages strong flowering growth. Can be cut back harder to renovate.","plant_url":"https://app.notion.com/p/3bcb667506ae81229248d7f5482a5ce5","url":"https://app.notion.com/p/3bcb667506ae816e99c2f956bd3806e5"},{"id":"3bcb6675-06ae-819b-979a-cc5fba9a7d9a","name":"Prune — cut back by a third in early spring","type":"Prune","month":"March","priority":"Medium","done":false,"instructions":"Cut back by approximately a third in early spring before new growth gets underway. This maintains a good compact shape and encourages strong new flowering growth. Can be cut back harder to renovate if the plant has become leggy or overgrown.","plant_url":"https://app.notion.com/p/3b9b667506ae8119a11ae0f94858954b","url":"https://app.notion.com/p/3bcb667506ae819b979acc5fba9a7d9a"},{"id":"3bbb6675-06ae-8163-8103-f3ce5ba346b9","name":"Mulch — apply leaf mould to retain moisture","type":"Mulch","month":"March","priority":"Medium","done":false,"instructions":"Apply a mulch of leaf mould or well-rotted compost around the base in spring to retain moisture and provide humus. Do not mulch over the crown. Check for slugs which are attracted to primula foliage.","plant_url":"https://app.notion.com/p/3bbb667506ae81eabb75f05fd431c9cd","url":"https://app.notion.com/p/3bbb667506ae81638103f3ce5ba346b9"},{"id":"3bbb6675-06ae-81d8-a900-ec0fbd26bbaf","name":"Divide / Propagate — divide every 3–4 years in spring","type":"Divide / Propagate","month":"March","priority":"Medium","done":false,"instructions":"Divide clumps in spring every 3–4 years to prevent plants becoming congested and straggly. Lift the whole clump, split into healthy sections with good root systems, and replant immediately. Discard the woody centre.","plant_url":"https://app.notion.com/p/3bbb667506ae8161b10de1f5936c62c0","url":"https://app.notion.com/p/3bbb667506ae81d8a900ec0fbd26bbaf"},{"id":"3bbb6675-06ae-8122-91ba-e795e71cfb2e","name":"Mulch — mulch pot surface to keep roots cool","type":"Mulch","month":"March","priority":"Medium","done":false,"instructions":"Mulch the top of the pot with bark or place a tile or stone over the compost surface to keep roots cool and moist. Clematis roots prefer cool, shaded conditions even when the top growth is in sun.","plant_url":"https://app.notion.com/p/3bbb667506ae81c49560e448b1de6b29","url":"https://app.notion.com/p/3bbb667506ae812291bae795e71cfb2e"},{"id":"3bbb6675-06ae-8127-a2cc-d847ca82db43","name":"Mulch — mulch around base with ericaceous material","type":"Mulch","month":"March","priority":"Medium","done":false,"instructions":"Apply a mulch of pine bark or ericaceous compost around the base to retain moisture, suppress weeds and gently acidify the soil. Keep mulch away from the stem. Check soil moisture — rhododendrons are shallow rooted and suffer in dry conditions.","plant_url":"https://app.notion.com/p/3bbb667506ae8185abfbc8576ecceb4c","url":"https://app.notion.com/p/3bbb667506ae8127a2ccd847ca82db43"},{"id":"3bab6675-06ae-81c3-83fd-d6b5528b99fc","name":"Feed — balanced fertiliser","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Apply a balanced slow-release fertiliser in early spring as shoots emerge to support strong flower spikes. Avoid high-nitrogen feeds which promote leaf at the expense of flowering.","plant_url":"https://app.notion.com/p/3bab667506ae81678c0fc6ca5c19226c","url":"https://app.notion.com/p/3bab667506ae81c383fdd6b5528b99fc"},{"id":"3bab6675-06ae-814c-9893-fae07fccdd31","name":"Frost Protection — protect buds from late frosts","type":"Frost Protection","month":"March","priority":"Medium","done":false,"instructions":"Check flower buds in late winter. If a late frost is forecast while buds are showing, protect with horticultural fleece overnight. Frost damage to buds causes brown, papery flowers that do not recover.","plant_url":"https://app.notion.com/p/3bab667506ae81a693a6dd07b9cebcbd","url":"https://app.notion.com/p/3bab667506ae814c9893fae07fccdd31"},{"id":"3bab6675-06ae-8198-9ded-e88a02ecc0e5","name":"Feed — balanced fertiliser","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Apply a balanced slow-release fertiliser in early spring to support healthy growth and flowering. Avoid high-nitrogen feeds which promote leaf at the expense of flowers.","plant_url":"https://app.notion.com/p/3bab667506ae81a693a6dd07b9cebcbd","url":"https://app.notion.com/p/3bab667506ae81989dede88a02ecc0e5"},{"id":"3bab6675-06ae-8104-8b08-d4b97ad792f6","name":"Divide / Propagate — divide clumps in green","type":"Divide / Propagate","month":"March","priority":"Medium","done":false,"instructions":"Divide snowdrops ‘in the green’ immediately after flowering while still in leaf. Lift, separate into small groups and replant immediately at the same depth.","plant_url":"https://app.notion.com/p/3b9b667506ae813b8273f8fe7ed3c1f7","url":"https://app.notion.com/p/3bab667506ae81048b08d4b97ad792f6"},{"id":"3bab6675-06ae-8152-a210-f17d84812079","name":"Divide / Propagate — divide clumps","type":"Divide / Propagate","month":"March","priority":"Medium","done":false,"instructions":"Divide large clumps every few years in late spring after hard pruning. Dig up and split using two forks back to back. Wear full protective clothing.","plant_url":"https://app.notion.com/p/3b9b667506ae81db972de8e27c65a318","url":"https://app.notion.com/p/3bab667506ae8152a210f17d84812079"},{"id":"3bab6675-06ae-811b-a631-d1900a427f69","name":"Feed — balanced fertiliser","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Apply a balanced fertiliser or top-dress with well-rotted compost around (not over) the crown in early spring.","plant_url":"https://app.notion.com/p/3b9b667506ae8136a2c3f156ae343088","url":"https://app.notion.com/p/3bab667506ae811ba631d1900a427f69"},{"id":"3bab6675-06ae-8126-819f-d00f92d3d901","name":"Feed — balanced slow-release","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Apply a balanced slow-release fertiliser to the pot in early spring. Top-dress with fresh compost if possible.","plant_url":"https://app.notion.com/p/3b9b667506ae81acb51ce8675a36271e","url":"https://app.notion.com/p/3bab667506ae8126819fd00f92d3d901"},{"id":"3bab6675-06ae-813c-87a0-c8a8896b5e2a","name":"Feed — balanced fertiliser","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Apply a low-nitrogen, high-potash fertiliser in early spring. Avoid high nitrogen which promotes leaf at the expense of flowers.","plant_url":"https://app.notion.com/p/3b9b667506ae81b3bf62efa71934012e","url":"https://app.notion.com/p/3bab667506ae813c87a0c8a8896b5e2a"},{"id":"3bab6675-06ae-8161-952d-c03dbcb377f4","name":"Feed — balanced fertiliser","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Apply a balanced slow-release granular fertiliser in spring as growth begins. Also feed monthly with a liquid feed through summer.","plant_url":"https://app.notion.com/p/3b9b667506ae818aa220f91d661e85e0","url":"https://app.notion.com/p/3bab667506ae8161952dc03dbcb377f4"},{"id":"3bab6675-06ae-817c-a1f0-fdfba7f4edf5","name":"Feed — bulb fertiliser","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Apply a balanced bulb fertiliser as shoots emerge in spring to support flowering and bulb development for next year.","plant_url":"https://app.notion.com/p/3b9b667506ae817da163fb05108db686","url":"https://app.notion.com/p/3bab667506ae817ca1f0fdfba7f4edf5"},{"id":"3bab6675-06ae-81a7-a564-cdd3d06f833a","name":"Feed — balanced fertiliser","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Apply a balanced slow-release fertiliser around the base in early spring as new growth emerges.","plant_url":"https://app.notion.com/p/3b9b667506ae81d183deeb3f4f653bef","url":"https://app.notion.com/p/3bab667506ae81a7a564cdd3d06f833a"},{"id":"3bab6675-06ae-81b8-a066-c6b45cf0bf4b","name":"Feed — rose fertiliser","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Feed with a specialist rose fertiliser in early spring as growth begins.","plant_url":"https://app.notion.com/p/3b9b667506ae81358ed1d2d3e88ac914","url":"https://app.notion.com/p/3bab667506ae81b8a066c6b45cf0bf4b"},{"id":"3bab6675-06ae-81be-b439-f721c8c6b328","name":"Feed — bulb fertiliser","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Apply a balanced bulb fertiliser as shoots emerge in spring.","plant_url":"https://app.notion.com/p/3b9b667506ae81e7b0d4d2aea76c51fa","url":"https://app.notion.com/p/3bab667506ae81beb439f721c8c6b328"},{"id":"3bab6675-06ae-81d0-9dbd-e495fd318a03","name":"Feed — rose fertiliser","type":"Feed","month":"March","priority":"Medium","done":false,"instructions":"Feed with a specialist rose fertiliser in early spring. Repeat in June after first flush.","plant_url":"https://app.notion.com/p/3b9b667506ae8140a55cc14eea830190","url":"https://app.notion.com/p/3bab667506ae81d09dbde495fd318a03"},{"id":"3bab6675-06ae-8105-8868-c59c947f447f","name":"Prune — cut back","type":"Prune","month":"March","priority":"Medium","done":false,"instructions":"Cut back to ground level in early spring. Leave stems over winter for wildlife.","plant_url":"https://app.notion.com/p/3b9b667506ae8171a48cf18c6181518f","url":"https://app.notion.com/p/3bab667506ae81058868c59c947f447f"},{"id":"3bab6675-06ae-813b-80f5-e62b24a1461d","name":"Prune — pollard or thin after catkins","type":"Prune","month":"March","priority":"Medium","done":false,"instructions":"Cut back hard after catkins to maintain size and encourage fresh growth.","plant_url":"https://app.notion.com/p/3b9b667506ae81cb9397d28540736350","url":"https://app.notion.com/p/3bab667506ae813b80f5e62b24a1461d"},{"id":"3bbb6675-06ae-81ca-a918-f106ac99101c","name":"Water — keep soil consistently moist through flowering","type":"Water","month":"May","priority":"High","done":false,"instructions":"Keep soil consistently moist at all times — this primula will not tolerate drought. In dry spells water deeply before the soil dries out. Mulch around the base to retain moisture.","plant_url":"https://app.notion.com/p/3bbb667506ae81eabb75f05fd431c9cd","url":"https://app.notion.com/p/3bbb667506ae81caa918f106ac99101c"},{"id":"3bbb6675-06ae-8137-9bd0-d46bf7227716","name":"Other — photograph flowers and identify cultivar and pruning group","type":"Other","month":"May","priority":"High","done":false,"instructions":"Photograph the flowers when open and use them to identify the cultivar and pruning group. Flower colour, size, number of petals and flowering time are the key identifiers. Once identified, update the plant record and adjust the pruning task accordingly. Do not cut back hard until the pruning group i","plant_url":"https://app.notion.com/p/3bbb667506ae81c49560e448b1de6b29","url":"https://app.notion.com/p/3bbb667506ae81379bd0d46bf7227716"},{"id":"3bbb6675-06ae-81b1-87af-e0b6d6739ee9","name":"Prune — deadhead spent trusses","type":"Prune","month":"May","priority":"High","done":false,"instructions":"Snap off spent flower trusses carefully just behind the truss once flowering has finished. Do not cut — snap cleanly to avoid damaging the growth buds immediately below. This encourages good bud set for next year.","plant_url":"https://app.notion.com/p/3bbb667506ae8185abfbc8576ecceb4c","url":"https://app.notion.com/p/3bbb667506ae81b187afe0b6d6739ee9"},{"id":"3bbb6675-06ae-8191-b7b3-d8941efbcee7","name":"Plant — plant out after frost risk","type":"Plant","month":"May","priority":"High","done":false,"instructions":"Plant out hardened-off seedlings after all risk of frost has passed, typically mid-May. Space 20–30cm apart in moderately fertile moist but well-drained soil. Water in well with a weak potash-rich fertiliser such as Tomorite.","plant_url":"https://app.notion.com/p/3bbb667506ae8143b75dc5098eb49c0b","url":"https://app.notion.com/p/3bbb667506ae8191b7b3d8941efbcee7"},{"id":"3bab6675-06ae-81be-a216-cb1ad3aa7ad7","name":"Plant — dahlias","type":"Plant","month":"May","priority":"High","done":false,"instructions":"Plant out stored tubers or young plants after last frost (mid-May in UK). Plant 10cm deep with a sturdy stake in place. Water in well.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae81bea216cb1ad3aa7ad7"},{"id":"3bab6675-06ae-81d5-ae5d-f8e6c46977cb","name":"Feed — high-potash feed","type":"Feed","month":"May","priority":"High","done":false,"instructions":"Continue fortnightly high-potash liquid feeds through May. Switch to a balanced feed if growth looks weak.","plant_url":"https://app.notion.com/p/3b9b667506ae816e8207ee3c7e54deea","url":"https://app.notion.com/p/3bab667506ae81d5ae5df8e6c46977cb"},{"id":"3bab6675-06ae-812e-8028-f0b0ca168941","name":"Prune — deadhead and light prune","type":"Prune","month":"May","priority":"High","done":false,"instructions":"Deadhead after flowering by snapping off spent trusses. Light prune to shape if needed.","plant_url":"https://app.notion.com/p/3b9b667506ae81df80d7dabf7eee7369","url":"https://app.notion.com/p/3bab667506ae812e8028f0b0ca168941"},{"id":"3bab6675-06ae-81a3-89c1-cd240fbc2212","name":"Prune — prune after flowering","type":"Prune","month":"May","priority":"High","done":false,"instructions":"Prune just after flowering. Avoid cutting into old wood as recovery is poor.","plant_url":"https://app.notion.com/p/3b9b667506ae8127a7d5c47fb82b7d22","url":"https://app.notion.com/p/3bab667506ae81a389c1cd240fbc2212"},{"id":"3bab6675-06ae-81c2-b82e-efcf33db5fff","name":"Prune — prune after flowering (Group 1)","type":"Prune","month":"May","priority":"High","done":false,"instructions":"Prune immediately after flowering (Group 1). Remove dead stems and trim back to healthy buds.","plant_url":"https://app.notion.com/p/3b9b667506ae812aa07cebf603035b3d","url":"https://app.notion.com/p/3bab667506ae81c2b82eefcf33db5fff"},{"id":"3bbb6675-06ae-81ac-9aaa-d3f4d47062ff","name":"Feed — balanced liquid feed","type":"Feed","month":"May","priority":"Low","done":false,"instructions":"Apply a balanced liquid feed fortnightly. Switch to a high-potash feed from midsummer to extend flowering.","plant_url":"https://app.notion.com/p/3bbb667506ae8142a2abcfe5e4241b0e","url":"https://app.notion.com/p/3bbb667506ae81ac9aaad3f4d47062ff"},{"id":"3bbb6675-06ae-81e0-8851-d2f03bed9111","name":"Feed — balanced liquid feed","type":"Feed","month":"May","priority":"Low","done":false,"instructions":"Apply a balanced liquid feed fortnightly through the growing season. A high-potash feed from midsummer encourages continued flowering.","plant_url":"https://app.notion.com/p/3bbb667506ae81a1abacf15c0e474488","url":"https://app.notion.com/p/3bbb667506ae81e08851d2f03bed9111"},{"id":"3bbb6675-06ae-816c-82b9-c63717f52112","name":"Divide / Propagate — take softwood cuttings","type":"Divide / Propagate","month":"May","priority":"Low","done":false,"instructions":"Take softwood cuttings from non-flowering shoots in spring or early summer. Root in free-draining compost with bottom heat.","plant_url":"","url":"https://app.notion.com/p/3bbb667506ae816c82b9c63717f52112"},{"id":"3bbb6675-06ae-818d-b819-da047e957e8b","name":"Divide / Propagate — take softwood cuttings","type":"Divide / Propagate","month":"May","priority":"Low","done":false,"instructions":"Take softwood cuttings from non-flowering shoots in spring or early summer. Root in free-draining compost with bottom heat.","plant_url":"","url":"https://app.notion.com/p/3bbb667506ae818db819da047e957e8b"},{"id":"3bab6675-06ae-81b1-9e07-cc468ddd99e1","name":"Divide /
